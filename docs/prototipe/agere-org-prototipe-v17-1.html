body[data-auth="1"] #toasts{left:24px;bottom:24px}
@media(max-width:767px){#toasts{left:8px;right:8px;bottom:56px}}
.ck-add{margin-left:0;gap:6px}
.ck-add .input{height:32px}
.add-trig{margin-left:-12px;color:var(--fg-subtle)}
.add-trig:hover{color:var(--fg-emphasis)}
.keys dl{grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.keys dt{order:2;justify-content:flex-end;grid-column:2}
.keys dd{order:1;grid-column:1;margin:0;font-size:13px;color:var(--fg-default)}
.keys dl{display:grid;grid-auto-flow:dense}
.keys{grid-template-columns:1fr;gap:20px}
.keys section+section{padding-top:16px;border-top:1px solid var(--border-default)}
.keys dl{column-gap:24px}
.mob-only{display:none!important}
@media(max-width:767px){.phd .acts .btn-outline{display:none}.mob-only{display:inline-flex!important}}
.fmt-row{display:flex;flex-wrap:wrap;gap:6px}
/* v16: header actions on narrow screens, import formats */
.mob-only{display:none}
@media(max-width:767px){.phd .acts .btn-outline{display:none}.mob-only{display:inline-flex}}
.fmt-list{display:grid;gap:10px;padding:12px 14px;border:1px solid var(--border-default);border-radius:var(--r-lg);background:var(--bg-muted)}
.fmt-ext{display:inline-grid;place-items:center;min-width:44px;height:24px;padding:0 6px;border-radius:var(--r-sm);background:var(--bg-default);border:1px solid var(--border-default);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--fg-emphasis)}

/* ================= v17 · aligned to Agere DS 6.4 ================= */
/* DS 6.4 token names (values identical to the v15 --t-* aliases) */
:root{--error-on-surface:#811d1d;--attention-on-surface:#9b3412;--success-on-surface:#096738;--info-on-surface:#243c84;--special-on-surface:#4b1b98}
:root[data-theme="dark"]{--error-on-surface:#ff6467;--attention-on-surface:#fb923c;--success-on-surface:#36d399;--info-on-surface:#8197f8;--special-on-surface:#af94f9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--error-on-surface:#ff6467;--attention-on-surface:#fb923c;--success-on-surface:#36d399;--info-on-surface:#8197f8;--special-on-surface:#af94f9}}
:root,:root[data-theme="dark"]{--t-err:var(--error-on-surface);--t-att:var(--attention-on-surface);--t-ok:var(--success-on-surface)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t-err:var(--error-on-surface);--t-att:var(--attention-on-surface);--t-ok:var(--success-on-surface)}}
/* Block editor: type-display-lg title, type-body-lg body, heading-xl / heading-lg */
.nd-title{font-weight:600}
.nd-body{line-height:24px}
.nd-body h2{font-size:24px;line-height:32px}
.nd-body h3{font-size:20px;line-height:28px}
.nd-todo>li::before{top:4px}
/* Nested list: caret is IconButton xs (24 px) */
.cl-row .car,.cl-row .car-sp{width:24px;height:24px}
.cl-row .car{border-radius:var(--r-md)}
.cl-row .car svg{width:12px;height:12px}
/* group drop target: a real dashed outline (box-shadow cannot be dashed) */
.cl-gh.gdrop-on,.cl-empty.gdrop-on{box-shadow:none;outline:1.5px dashed var(--fg-emphasis);outline-offset:-2px;background:var(--bg-subtle);border-radius:var(--r-md)}
/* PageHeaderLeading: 48 px, radius xl (14 px) */
.phd>.ptile,.phd>.sk-ic,.phd>span.ptile{border-radius:var(--r-xl)!important}
/* RuleBuilderPreview icon: 32 px tile on bg-background */
.tg-preview .sk-ic{width:32px;height:32px;border-radius:var(--r-md);background:var(--bg-default)}
.tg-preview .sk-ic svg{width:16px;height:16px}
/* SaveBar: text-sm status with a 16 px icon */
.savebar .st{font-size:14px;line-height:20px}
.savebar .st svg{width:16px;height:16px}
/* SaveStatus: the saving icon spins, and stops with reduced motion */
.nd-status .spin-i{animation:spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.nd-status .spin-i,.spin{animation:none}}
.tg-preview .sk-ic{flex:none}
/* list rows: nothing before the name may shrink (long titles squeezed the status icon to 21 px) */
.cl-row .lead>*:not(.name){flex:none}
.cl-row .st-btn{flex:none}
/* shell rows are bounded: only #content scrolls; rail, panel and topbar stay put (regression since v14 safe-area change) */
.shell{grid-template-rows:minmax(0,1fr)}
.main,.inset,.panel,.guide-col{min-height:0}
/* task detail per UI-01 v2.4: property label 160 px, activity pane 400 px */
.prop{grid-template-columns:160px minmax(0,1fr)}
.tm-grid{grid-template-columns:minmax(0,1fr) 400px}
@media(max-width:900px){.tm-grid{grid-template-columns:1fr}}

function placePop(el,anchor,opt={}){
 const b=anchor.getBoundingClientRect();const w=Math.max(opt.minW||0,el.offsetWidth);

}

 setOv(`<div class="scrim" data-a="scrim"><div class="cmdk" role="dialog" aria-modal="true" aria-label="Palet perintah"><div class="q">${ic("search")}<input id="cmdq" placeholder="Cari tugas, proyek, orang, atau tindakan" role="combobox" aria-expanded="true" aria-controls="cmdres" aria-autocomplete="list" autocomplete="off"><span class="kbd">Esc</span></div><div class="res" id="cmdres" role="listbox"></div><div class="foot"><span><span class="kbd">↑</span><span class="kbd">↓</span>Pilih</span><span><span class="kbd">↵</span>Buka</span><span><span class="kbd">Esc</span>Tutup</span></div></div></div>`);

 draw();inp.focus();

 fstep:el=>{S.flowDone[el.dataset.k]=el.checked;render();},

const IN={},CH={};

 /* ARIA tabs: arrow keys */
 const tb=e.target.closest&&e.target.closest('[role="tablist"]');
 if(tb&&["ArrowLeft","ArrowRight","Home","End"].includes(e.key)){const ts=$$('[role="tab"]',tb);const i=ts.indexOf(e.target);let j=e.key==="ArrowRight"?(i+1)%ts.length:e.key==="ArrowLeft"?(i-1+ts.length)%ts.length:e.key==="Home"?0:ts.length-1;e.preventDefault();const k=ts[j].id||null;ts[j].click();setTimeout(()=>{const t2=$$('[role="tab"]',$('[role="tablist"]'))[j];t2&&t2.focus();},0);}
});

document.addEventListener("mouseover",e=>{

});

function pAnggota(){
 const tab=S.memberTab;const q=(S.mq||"").toLowerCase();

 const list=grp[tab].filter(m=>!q||(m.name+m.email).toLowerCase().includes(q));
 const ad=isAdmin();
 const tabs=`<div class="tabs" role="tablist">${[["aktif","Aktif"],["undangan","Undangan"],["tangguh","Ditangguhkan"]].filter(x=>ad||x[0]==="aktif").map(([k,l])=>`<button class="tab" role="tab" id="mt-${k}" aria-selected="${tab===k}" data-a="mtab" data-k="${k}">${l}${isIdeal()?`<span class="count">${grp[k].length}</span>`:""}</button>`).join("")}</div>`;
 const st=stateOf({skel:"table",what:"Anggota",empty:{ill:"empty",title:"Baru Anda di sini",desc:"Undang rekan kerja agar bisa berbagi proyek dan tugas.",action:ad?`<button class="btn btn-primary" data-a="invite">${ic("userplus")}Undang anggota</button>`:""}});
 const roleBadge=r=>`<span class="badge ${r==="Owner"?"solid":r==="Admin"?"outline":""}" ${r==="Member"?'style="background:var(--bg-subtle)"':""}>${r}</span>`;
 const rows=list.map(m=>`<tr><td><div class="row gap12">${m.name?av(m.k,"md"):`<span class="av-empty md">${ic("mail",14)}</span>`}<div class="col"><span class="strong">${esc(m.name||m.email)}${m.k===S.me?' <span class="muted">(Anda)</span>':""}</span><span class="caption muted">${esc(m.email)}</span></div></div></td><td>${roleBadge(m.role)}</td><td class="muted">${tab==="undangan"?(m.expired?`<span class="err-t">${m.last}</span>`:m.last):tab==="tangguh"?"Ditangguhkan "+m.last:m.last}</td><td class="muted">${TEAMS.filter(t=>t.members.includes(m.k)).map(t=>t.name).join(", ")||"Belum ada tim"}</td><td class="c-act">${ad&&m.k!==S.me&&m.role!=="Owner"?`<button class="btn btn-ghost icon-btn tiny" data-a="mrow" data-k="${m.k}" aria-haspopup="menu" aria-label="Tindakan untuk ${esc(m.name||m.email)}">${ic("more",14)}</button>`:""}</td></tr>`).join("");
 return `<div class="page">${pageHead("Anggota",isIdeal()?`${grp.aktif.length} anggota aktif${ad?` · ${grp.undangan.length} undangan tertunda`:""}`:"",ad?`<button class="btn btn-primary" data-a="invite">${ic("userplus")}Undang anggota</button>`:"")}
 ${tabs}${st||`<div class="toolbar"><div class="search">${ic("search")}<input class="input" type="search" placeholder="Cari nama atau email" aria-label="Cari anggota" value="${esc(S.mq||"")}" data-in="mq"></div></div>${list.length?`<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Nama</th><th style="width:120px">Peran</th><th style="width:220px">${tab==="undangan"?"Berlaku":tab==="tangguh"?"Status":"Terakhir aktif"}</th><th style="width:200px">Tim</th><th class="c-act"><span class="sr">Tindakan</span></th></tr></thead><tbody>${rows}</tbody></table></div>`:emptyBlock({ill:"no-results",title:tab==="undangan"?"Tidak ada undangan tertunda":tab==="tangguh"?"Tidak ada anggota ditangguhkan":"Tidak ada anggota yang cocok",desc:q?"Coba kata lain.":""})}`}</div>`;
}

Object.assign(ACT,{
 mtab:el=>{S.memberTab=el.dataset.k;rerenderKeep(`#mt-${el.dataset.k}`);},
 invite:()=>inviteDlg(),
 mrow:el=>{const m=member(el.dataset.k);const items=m.status==="diundang"?[{l:"Kirim ulang undangan",icon:"mail",fn:()=>{m.last="Berlaku sampai 5 Okt 2026";m.expired=false;render();toast(`Undangan dikirim ulang ke ${m.email}.`);}},{l:"Salin tautan undangan",icon:"link",fn:()=>toast("Tautan undangan disalin.")},"sep",{l:"Batalkan undangan",icon:"x",danger:true,fn:()=>{MEMBERS.splice(MEMBERS.indexOf(m),1);render();toast("Undangan dibatalkan.");}}]:m.status==="ditangguhkan"?[{l:"Aktifkan kembali",icon:"refresh",fn:()=>{m.status="aktif";render();toast(`${m.name} aktif kembali.`);}},"sep",{l:"Hapus dari organisasi",icon:"trash",danger:true,fn:()=>removeWizard(m.k)}]:[{label:"Peran"},...["Admin","Member"].map(r=>({l:r,check:m.role===r,fn:()=>{if(m.role===r)return;if(r==="Admin")confirmDlg({title:`Jadikan ${m.name} Admin?`,body:"Admin bisa mengelola anggota, akses, dan aplikasi. Tindakan ini tercatat di Audit.",verb:"Jadikan Admin",danger:false,fn:()=>{m.role="Admin";render();toast(`${m.name} sekarang Admin.`);}});else{m.role=r;render();toast(`${m.name} sekarang Member.`);}}})),"sep",{l:"Tangguhkan",icon:"pause",fn:()=>confirmDlg({title:`Tangguhkan ${m.name}?`,body:"Akses dicabut segera tanpa menghapus data. Tugasnya tetap atas namanya sampai dialihkan.",verb:"Tangguhkan",fn:()=>{m.status="ditangguhkan";m.last=fDY(NOW);render();toast(`${m.name} ditangguhkan.`);}})},{l:"Hapus dari organisasi",icon:"trash",danger:true,fn:()=>removeWizard(m.k)}];openMenu(el,items,{alignRight:true,w:240});}

function inviteDlg(){
 if(!isAdmin()){toast("Hanya Owner dan Admin yang bisa mengundang anggota.",{err:true});return;}
 openDlg(dlg({title:"Undang anggota",desc:`Undangan berlaku 7 hari. Penerima bergabung ke ${ORG.name} setelah membuat akun.`,body:`
 <div class="field"><label class="label" for="iv-e">Email</label><textarea class="textarea" id="iv-e" rows="3" autofocus></textarea><p class="ferr" id="iv-err" hidden>${ic("alert")}<span></span></p><p class="help">Pisahkan dengan koma atau baris baru, maksimal 20 email.</p></div>
 <div class="fgrid two"><div class="field"><span class="label" id="iv-r-l">Peran</span>${sel("iv-r","Member",[{v:"Member",l:"Member",hint:"Bekerja di proyek"},{v:"Admin",l:"Admin",hint:"Kelola organisasi"}],markDirty,{labelledby:"iv-r-l"})}</div>

}
ACT["iv-send"]=()=>{const t=$("#iv-e"),er=$("#iv-err");const es=t.value.split(/[,\s]+/).map(x=>x.trim()).filter(Boolean);
 const bad=es.filter(e=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e));const dup=es.filter(e=>MEMBERS.some(m=>m.email.toLowerCase()===e.toLowerCase()));
 const msg=!es.length?"Masukkan minimal satu email.":bad.length?`Format email belum benar: ${bad.join(", ")}`:dup.length?`${dup.join(", ")} sudah menjadi anggota atau sudah diundang.`:es.length>20?"Maks. 20 email sekaligus.":"";
 if(msg){t.setAttribute("aria-invalid","true");er.hidden=false;er.lastChild.textContent=msg;t.focus();return;}
 es.forEach(e=>MEMBERS.push({k:"u"+uid(),name:"",email:e,role:SELS["iv-r"].value,status:"diundang",joined:fDY(NOW),last:"Berlaku sampai 5 Okt 2026"}));S.onb.invite=true;closeOv(true);S.memberTab="undangan";render();toast(`${es.length} undangan terkirim.`);};
function removeWizard(k){const m=member(k);const open=TASKS.filter(t=>!t.deleted&&t.assignee===k&&!isDone(t));const led=PROJECTS.filter(p=>p.lead===k);const cand=MEMBERS.filter(x=>x.status==="aktif"&&x.k!==k);
 openDlg(dlg({title:`Hapus ${m.name||m.email}?`,desc:"Akses dicabut segera. Pekerjaan yang masih berjalan perlu pemilik baru.",body:`
 <div class="card flat" style="padding:14px 16px;display:grid;gap:8px"><span class="row sm">${ic("checks")}<b class="num">${open.length}</b>&nbsp;tugas terbuka</span><span class="row sm">${ic("layers")}<b class="num">${led.length}</b>&nbsp;proyek dipimpin</span></div>
 ${open.length||led.length?`<div class="field"><span class="label" id="rw-l">Alihkan pekerjaan ke</span>${sel("rw",cand[0].k,cand.map(x=>({v:x.k,l:x.name||x.email,icon:av(x.k,"xs")})),markDirty,{labelledby:"rw-l"})}<p class="help">Hanya tugas di proyek yang bisa dibuka penerima akan dialihkan. Sisanya menjadi Belum ditugaskan.</p></div>`:`<p class="muted sm">Tidak ada pekerjaan yang perlu dialihkan.</p>`}`,
 foot:`<button class="btn btn-ghost" data-a="close">Batal</button><button class="btn btn-danger" data-a="rw-go" data-k="${k}">Hapus anggota</button>`}));}
ACT["rw-go"]=el=>{const k=el.dataset.k;const m=member(k);const to=SELS.rw?SELS.rw.value:null;let moved=0,un=0;TASKS.filter(t=>t.assignee===k&&!isDone(t)).forEach(t=>{if(to&&projAccessNat(projById(t.pid),to)){t.assignee=to;moved++;}else{t.assignee=null;un++;}});PROJECTS.filter(p=>p.lead===k).forEach(p=>p.lead=to||S.me);MEMBERS.splice(MEMBERS.indexOf(m),1);TEAMS.forEach(t=>t.members=t.members.filter(x=>x!==k));closeOv(true);render();toast(`${m.name||m.email} dihapus. ${moved} tugas dialihkan${un?`, ${un} menjadi Belum ditugaskan`:""}.`);};

function trendCard(p){
 const seed=[...p.id].reduce((a,c)=>a+c.charCodeAt(0),0);const wk=["24 Agu","31 Agu","7 Sep","14 Sep","21 Sep","28 Sep"];
 const made=wk.map((_,i)=>2+((seed*(i+3))%5));const done=wk.map((_,i)=>Math.max(0,made[i]-1+((seed+i)%3)-1));
 const mx=Math.max(...made,...done,1);const W=520,H=160,bw=18,gx=W/wk.length;
 const bars=wk.map((w,i)=>{const x=i*gx+gx/2;const h1=made[i]/mx*(H-24),h2=done[i]/mx*(H-24);return `<rect x="${x-bw-2}" y="${H-h1}" width="${bw}" height="${h1}" rx="3" fill="var(--chart-series-3)" opacity=".35"><title>${w}: ${made[i]} dibuat</title></rect><rect x="${x+2}" y="${H-h2}" width="${bw}" height="${h2}" rx="3" fill="var(--chart-series-3)"><title>${w}: ${done[i]} selesai</title></rect><text x="${x}" y="${H+18}" text-anchor="middle" font-size="11" fill="var(--fg-subtle)">${w}</text>`;}).join("");
 const tot=done.reduce((a,b)=>a+b,0),totm=made.reduce((a,b)=>a+b,0);
 return `<section class="card card-pad" style="display:grid;gap:16px"><div class="card-head"><h2 class="h2">Tren 6 minggu</h2><div class="row gap16 caption muted"><span class="row gap4"><i class="lg-sw" style="opacity:.35"></i>Dibuat ${totm}</span><span class="row gap4"><i class="lg-sw"></i>Selesai ${tot}</span></div></div>
 <svg viewBox="0 -4 ${W} ${H+26}" role="img" aria-label="Tugas dibuat dan selesai per minggu: ${wk.map((w,i)=>`${w} ${made[i]} dibuat ${done[i]} selesai`).join("; ")}" style="width:100%;height:auto">${[0.25,0.5,0.75,1].map(f=>`<line x1="0" x2="${W}" y1="${H-f*(H-24)}" y2="${H-f*(H-24)}" stroke="var(--border-default)" stroke-dasharray="2 4"/>`).join("")}<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--border-emphasis)"/>${bars}</svg>
 <p class="caption muted">${tot>=totm?"Tim menyelesaikan lebih cepat dari tugas masuk.":`Tugas masuk ${totm-tot} lebih banyak dari yang selesai. Periksa beban kerja di Daftar.`}</p></section>`;
}

function dropZone(e,row){const t=taskById(S.ldrag),tg=taskById(row.dataset.lrow);if(!t||!tg||t===tg||tg.parent===t.id||tg.pid!==t.pid)return null;const r=row.getBoundingClientRect();const y=(e.clientY-r.top)/r.height;
 const canNest=!tg.parent&&!kidsOf(t).length&&t.parent!==tg.id;if(y>.3&&y<.7&&canNest)return"in";return y<.5?"before":"after";}
document.addEventListener("dragstart",e=>{const row=e.target.closest&&e.target.closest("[data-lrow]");if(!row)return;if(e.target.closest("input,textarea,[contenteditable]")){e.preventDefault();return;}S.ldrag=row.dataset.lrow;row.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",S.ldrag);});

document.addEventListener("dragover",e=>{if(!S.ldrag)return;const row=e.target.closest&&e.target.closest("[data-lrow]");const g=e.target.closest&&e.target.closest("[data-gdrop]");
 if(row){const z=dropZone(e,row);clearDrop();if(z){e.preventDefault();row.classList.add("drop-"+z);}}else if(g){e.preventDefault();clearDrop();g.classList.add("gdrop-on");}});
document.addEventListener("drop",e=>{if(!S.ldrag)return;const t=taskById(S.ldrag);const row=e.target.closest&&e.target.closest("[data-lrow]");const g=e.target.closest&&e.target.closest("[data-gdrop]");
 if(row){const z=dropZone(e,row);if(!z)return;e.preventDefault();const tg=taskById(row.dataset.lrow);const s=snap(t);
  if(z==="in"){S.ldrag=null;clearDrop();nestInto(t,tg);return;}
  if(tg.parent)t.parent=tg.parent;else{delete t.parent;t.col=tg.col;}
  const sib=siblingsOf(tg).filter(x=>x!==t);const at=sib.indexOf(tg)+(z==="after"?1:0);sib.splice(at,0,t);renum(sib);
  S.ldrag=null;clearDrop();undoMove(t,s,`${t.title} dipindahkan${s.col!==t.col?" ke "+colOf(t).name:""}.`);}
 else if(g){e.preventDefault();const s=snap(t);delete t.parent;t.col=g.dataset.gdrop;const sib=siblingsOf(t).filter(x=>x!==t);sib.push(t);renum(sib);S.ldrag=null;clearDrop();undoMove(t,s,`${t.title} dipindahkan ke ${colOf(t).name}.`);}});

 foot:`<button class="btn btn-ghost" data-a="close">Batal</button>`}));
CH.mdin=el=>{const f=el.files[0];if(!f)return;const e=$("#md-e");const raw=(f.name.match(/\.([a-z0-9]+)$/i)||[])[1]?.toLowerCase();const ext=DOC_EXT[raw];
 if(!ext){e.hidden=false;e.lastChild.textContent=`Format .${raw||"?"} belum didukung. Gunakan .md, .markdown, atau .txt.`;return;}
 if(f.size>1048576){e.hidden=false;e.lastChild.textContent="Ukuran file maksimal 1 MB.";return;}
 const r=new FileReader();r.onload=()=>{const txt=r.result;const base=f.name.replace(/\.[^.]+$/,"");let h=base,body;
  if(ext==="md"||ext==="markdown"){h=(txt.match(/^#\s+(.+)$/m)||[])[1]||base;body=mdToHtml(txt.replace(/^#\s+.+$/m,""));}
  else body=txt.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
  const id="d"+uid();DOCS.unshift({id,folder:null,name:h.trim(),by:S.me,at:fDY(NOW),projects:[],src:f.name,body:body||"<p><br></p>"});closeOv(true);go("doc",{did:id});toast(`${f.name} diimpor sebagai Doc.`);};r.readAsText(f);};
function mdToHtml(md){const out=[];let list=null;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/`(.+?)`/g,"<code>$1</code>");
 const close=()=>{if(list){out.push(`</${list}>`);list=null;}};let code=null;
 md.split("\n").forEach(l=>{if(code!==null){if(/^```/.test(l)){out.push(`<pre>${esc(code.join("\n"))}</pre>`);code=null;}else code.push(l);return;}
  if(/^```/.test(l)){close();code=[];return;}
  let m;if((m=l.match(/^###\s+(.*)/))){close();out.push(`<h3>${inl(m[1])}</h3>`);}else if((m=l.match(/^##\s+(.*)/))){close();out.push(`<h2>${inl(m[1])}</h2>`);}
  else if((m=l.match(/^- \[( |x)\]\s+(.*)/i))){if(list!=="ul class=\"nd-todo\""){close();out.push('<ul class="nd-todo">');list='ul class="nd-todo"';}out.push(`<li data-checked="${m[1].toLowerCase()==="x"}">${inl(m[2])}</li>`);}
  else if((m=l.match(/^[-*]\s+(.*)/))){if(list!=="ul"){close();out.push("<ul>");list="ul";}out.push(`<li>${inl(m[1])}</li>`);}
  else if((m=l.match(/^\d+\.\s+(.*)/))){if(list!=="ol"){close();out.push("<ol>");list="ol";}out.push(`<li>${inl(m[1])}</li>`);}
  else if((m=l.match(/^>\s?(.*)/))){close();out.push(`<blockquote>${inl(m[1])}</blockquote>`);}
  else if(/^---+$/.test(l.trim())){close();out.push("<hr>");}
  else if(l.trim()){close();out.push(`<p>${inl(l)}</p>`);}else close();});
 close();if(code!==null)out.push(`<pre>${esc(code.join("\n"))}</pre>`);
 return out.join("").replace(/<\/?ul class="nd-todo">/g,m=>m.startsWith("</")?"</ul>":m);}

function parseCsv(txt){const rows=[];txt.split(/\r?\n/).filter(l=>l.trim()).forEach(l=>{const c=[];let cur="",q=false;for(const ch of l){if(ch==='"'){q=!q;}else if(ch===","&&!q){c.push(cur.trim());cur="";}else cur+=ch;}c.push(cur.trim());rows.push(c);});
 return rows.filter(r=>r.length>=3&&!/^tugas$/i.test(r[0])).map(([t,a,b,w])=>tlRow(t,a,b,w));}

CH.tlin=el=>{const f=el.files[0];if(!f)return;const e=$("#tl-e");const ext=(f.name.match(/\.([a-z0-9]+)$/i)||[])[1]?.toLowerCase();
 if(!["md","csv"].includes(ext)){e.hidden=false;e.lastChild.textContent=`Format .${ext||"?"} belum didukung. Gunakan .md atau .csv.`;return;}
 if(f.size>524288){e.hidden=false;e.lastChild.textContent="Ukuran file maksimal 512 KB.";return;}
 const r=new FileReader();r.onload=()=>{const rows=ext==="csv"?parseCsv(r.result):parseTl(r.result);if(!rows.length){e.hidden=false;e.lastChild.textContent="Tidak ada baris yang dikenali. Unduh contoh untuk acuan.";return;}S.tlRows=rows;S.tlSrc=f.name;drawTl();};r.readAsText(f);};

/* v17 · one date grammar for timeline import (PRD-06 v2.1 §6.11): ISO, DD/MM/YYYY, "5 Okt 2026", relative Wn (W1 = the import week) */
const MON_ID={jan:0,feb:1,mar:2,apr:3,mei:4,jun:5,jul:6,agu:7,agt:7,sep:8,okt:9,nov:10,des:11};
function tlDate(v,end){v=(v||"").trim();let m;
 if((m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/))){const d=new Date(+m[1],+m[2]-1,+m[3]);return d.getMonth()===+m[2]-1&&d.getDate()===+m[3]?iso(d):null;}
 if((m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))){const d=new Date(+m[3],+m[2]-1,+m[1]);return d.getMonth()===+m[2]-1?iso(d):null;}
 if((m=v.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})$/))&&MON_ID[m[2].toLowerCase()]!=null){const d=new Date(+m[3],MON_ID[m[2].toLowerCase()],+m[1]);return d.getDate()===+m[1]?iso(d):null;}
 if((m=v.match(/^W(\d{1,2})$/i))&&+m[1]>=1&&+m[1]<=26){const mon=new Date(NOW);mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7)+(+m[1]-1)*7);if(end)mon.setDate(mon.getDate()+4);return iso(mon);}
 return null;}
function tlRow(t,a,b,w){const A=tlDate(a,false),B=tlDate(b,true);return {t,a:A||a,b:B||b,raw:[a,b],w:(w||"").toLowerCase(),ok:!!t&&!!A&&!!B&&A<=B};}
parseTl=function(txt){return txt.split("\n").filter(l=>/^\|/.test(l)&&!/^\|\s*-/.test(l)).map(l=>l.split("|").slice(1,-1).map(x=>x.trim())).filter(r=>r.length>=3&&!/^tugas$/i.test(r[0])).map(([t,a,b,w])=>tlRow(t,a,b,w));};

HOWTO.agen.items.push({t:"Membuat pemicu otomatis",steps:["Buka Agen › Pemicu, lalu pilih Pemicu baru.","Isi Kapan, Di mana, Jika (opsional), dan skill yang dijalankan.","Kalimat pratinjau di atas memastikan pemicunya sesuai maksud Anda."],go:["agen-pemicu"],sel:".tg-list"});
HOWTO.space.items.push({t:"Membuat dan memindah subtugas",steps:["Di tab Daftar, arahkan kursor ke tugas lalu pilih + untuk menambah subtugas.","Seret baris lewat pegangan ⋮⋮. Lepas di tengah baris lain untuk menjadikannya subtugas.","Dengan keyboard: menu ⋯ baris, lalu Jadikan subtugas atau Naikkan dan Turunkan."],go:["proyek",{pid:"sd",tab:"daftar"}],sel:".cl"});
const CTA_AUDIT=[
 ["Sedang","Aksi ganda di header dan menu ⋯","Bagikan tampil sebagai tombol dan diulang di menu ⋯ proyek dan space; Proyek baru juga diulang di ⋯ space.","Satu aksi, satu tempat. Item ganda dihapus dari ⋯ dan baru muncul di sana saat layar sempit."],
 ["Sedang","Varian aksi kedua tidak seragam","Kelola formulir memakai ghost, sementara aksi kedua di header lain memakai outline.","Semua aksi kedua di header memakai outline."],
 ["Rendah","Label terikat satu format","Impor .md dan Impor dari .md mengunci label pada satu format.","Label umum Impor; format yang didukung tampil di dialog. Doc menerima .md dan .txt, Timeline menerima .md dan .csv."],
 ["Tinggi","Dua tombol utama identik saat kosong","Header dan empty state sama-sama menampilkan tombol hitam (Tugas baru, Proyek baru) di 9 layar.","Empty state memegang aksi utama; tombol di header disembunyikan otomatis saat kosong."],
 ["Tinggi","Tombol hapus merah di pintu masuk","Zona berbahaya dan footer dialog memakai merah solid sebelum pengguna mengonfirmasi.","Destructive solid hanya untuk konfirmasi akhir. Pintu masuk memakai destructive-outline dari DS."],
 ["Sedang","Aksi ketiga bercampur di header","Tandai semua dibaca, Edit space, dan Batal editor skill memakai ghost di baris aksi header.","Header: maksimal satu utama dan dua outline; sisanya pindah ke menu ⋯, toolbar, atau save bar."],
 ["Sedang","Ukuran tidak mengikuti konteks","Tombol 36px di baris tabel dan 40px di dialog.","md untuk header, dialog, dan form; lg hanya auth dan onboarding; sm untuk toolbar dan kartu; xs untuk baris tabel."],
 ["Rendah","Varian non-DS","btn-danger-ghost tidak ada di Agere DS.","Diganti destructive-outline. Varian secondary dibatasi untuk status terpilih."]
];
const CTA_RULES=[["Default (hitam)","Satu per layar. Aksi maju: buat, simpan, kirim."],["Outline","Aksi kedua di samping aksi utama, maksimal dua di header."],["Ghost","Aksi ketiga, Batal, utilitas toolbar, dan tombol ikon."],["Destructive","Hanya tombol konfirmasi akhir di dialog."],["Destructive outline","Pintu masuk ke alur penghapusan."],["Link","Hanya di dalam kalimat."],["Secondary","Hanya status terpilih pada toggle."]];
const HEADER_RULES=[["Susunan","Avatar akses (opsional), maksimal 2 outline berlabel, 1 default berlabel, lalu ⋯ ikon paling kanan."],["Label","Kata kerja + objek, sentence case. Nama aksi yang bisa berkembang ke banyak format memakai label umum: Impor, Ekspor. Formatnya dijelaskan di dalam dialog atau menu."],["Ikon di tombol berlabel","Opsional, hanya bila bermakna tunggal, misalnya + untuk buat baru."],["Ikon saja","Hanya ⋯ dan aksi yang ikonnya universal. Wajib tooltip dan aria-label."],["Satu aksi, satu tempat","Aksi yang tampil sebagai tombol tidak diulang di menu ⋯ pada ukuran layar yang sama."],["Layar sempit (<768px)","Tombol outline pindah ke ⋯ (jadi item pertama); tombol default tetap berlabel."],["Empty state","Tombol default di header disembunyikan; empty state yang memegang aksi utama."]];
const DS_UPDATES=[["Token on-surface","info, success, attention, error, special › on-surface: teks status di permukaan netral. Terang langkah 800, gelap langkah 300 (error: red 400). Kontras terukur 6,21–11,00 : 1. Prototipe memakai nilai yang sama (--error-on-surface dan seterusnya)."],["PageHeader + PageHeaderActions","Satu primary berlabel, maksimal dua outline (dikunci lewat tipe), menu ⋯; di bawah md outline pindah ke ⋯. Peringatan saat development bila satu aksi muncul di dua tempat."],["SaveBar","Footer lengket untuk simpan eksplisit. Batal dan Simpan nonaktif sampai ada perubahan."],["SaveStatus","Status Tersimpan, Menyimpan…, dan Gagal menyimpan untuk halaman autosave seperti Doc. Menggantikan tombol Simpan."],["RuleBuilder","Baris Kapan, Di mana, Jika, Lalu dengan kalimat pratinjau di region status."],["Toaster position dan offset","Default tetap tengah bawah; kiri bawah untuk halaman dengan SaveBar atau footer dialog di kanan."],["Tree helpers","getDropZone, canDrop, moveTreeItem, siblingsOf: logika seret-lepas daftar bertingkat sebagai fungsi murni yang diuji."],["Pola dan pedoman","Actions & CTA, placeholder hanya di pencarian, Nested list, dan Block editor. Nested list dan Block editor berupa pola terdokumentasi, bukan komponen."]];
ACT["audit-sheet"]=()=>{S.dock=false;renderDock();S.ovTrigger=document.activeElement;const tbl=(rows,w)=>`<div class="card tbl-wrap"><table class="tbl"><tbody>${rows.map(([a,b])=>`<tr><td class="strong" style="width:${w}px">${a}</td><td>${b}</td></tr>`).join("")}</tbody></table></div>`;
 setOv(`<div class="scrim" data-a="scrim" style="justify-content:flex-end;padding:0"><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="as-t"><div class="sh"><h2 class="h2 grow" id="as-t">Catatan audit & redesign v17.1</h2><button class="btn btn-ghost btn-sm icon-btn" data-a="close" aria-label="Tutup">${ic("x")}</button></div><div class="sb" style="display:grid;gap:28px">
 <p class="muted">Catatan ini hanya ada di prototipe. v17 menyelaraskan prototipe dengan Agere DS 6.4. v16 merapikan aksi header dan label Impor. v15 menambahkan audit CTA, pemicu Agen, Doc tanpa mode edit, subtugas, dan semua fitur rilis berikutnya.</p>
 <section><h3 class="h3" style="margin-bottom:4px">Audit CTA</h3>${CTA_AUDIT.map(([sv,t,a,b])=>`<div class="find"><span class="badge ${sv==="Tinggi"?"err":sv==="Sedang"?"att":"outline"}">${sv}</span><span class="strong">${t}</span><p class="fx">${a}</p><p class="fx"><b>Perbaikan:</b> ${b}</p></div>`).join("")}</section>
 <section><h3 class="h3" style="margin-bottom:8px">Aturan varian tombol</h3>${tbl(CTA_RULES,180)}</section>
 <section><h3 class="h3" style="margin-bottom:8px">Pedoman Page header actions</h3>${tbl(HEADER_RULES,180)}</section>
 <section><h3 class="h3" style="margin-bottom:8px">Agere DS 6.4 (dirilis 28 Sep 2026)</h3>${tbl(DS_UPDATES,150)}</section>
 <section><h3 class="h3" style="margin-bottom:4px">Temuan v14</h3>${AUDIT_NOTES.map(([sv,t,a,b])=>`<div class="find"><span class="badge ${sv==="Tinggi"?"err":sv==="Sedang"?"att":"outline"}">${sv}</span><span class="strong">${t}</span><p class="fx">${a}</p><p class="fx"><b>Perbaikan:</b> ${b}</p></div>`).join("")}</section>
 <section><h3 class="h3" style="margin-bottom:8px">Keputusan PRD</h3><div class="card tbl-wrap"><table class="tbl"><tbody>${[["PRD-17","Otomatisasi digabung ke Agen › Pemicu","Disetujui"],["PRD-02","Onboarding 3 langkah: Organisasi, Titik mulai, Undang tim","Disetujui"],["PRD-10","Lonceng topbar dihapus, notifikasi di Desk","Menunggu"],["UI-01","Skala judul 24/32 sesuai DS","Menunggu"],["C-20","Lampiran file tetap ditunda (bukan bagian rilis berikutnya)","Menunggu"]].map(([d,t,s])=>`<tr><td class="strong" style="width:90px">${d}</td><td>${t}</td><td style="width:120px"><span class="badge ${s==="Disetujui"?"ok":"outline"}">${s}</span></td></tr>`).join("")}</tbody></table></div></section>
 </div></aside></div>`);setTimeout(()=>$("#as-t")?.parentNode.querySelector("button")?.focus(),0);};


</script>
