body[data-auth="1"] #toasts{left:24px;bottom:24px}
@media(max-width:767px){#toasts{left:8px;right:8px;bottom:56px}}
.ck-add{margin-left:0;gap:6px}
.ck-add .input{height:32px}
.add-trig{margin-left:-12px;color:var(--fg-subtle)}
.add-trig:hover{color:var(--fg-emphasis)}
.keys dl{grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.keys dt{order:2;justify-content:flex-end;grid-column:2}
.keys dd{order:1;grid-column:1;margin:0;font-size:13px;color:var(--fg-default)}
.keys dl{display:grid;grid-auto-flow:dense}
.keys{grid-template-columns:1fr;gap:20px}
.keys section+section{padding-top:16px;border-top:1px solid var(--border-default)}
.keys dl{column-gap:24px}
.mob-only{display:none!important}
@media(max-width:767px){.phd .acts .btn-outline{display:none}.mob-only{display:inline-flex!important}}
.fmt-row{display:flex;flex-wrap:wrap;gap:6px}
/* v16: header actions on narrow screens, import formats */
.mob-only{display:none}
@media(max-width:767px){.phd .acts .btn-outline{display:none}.mob-only{display:inline-flex}}
.fmt-list{display:grid;gap:10px;padding:12px 14px;border:1px solid var(--border-default);border-radius:var(--r-lg);background:var(--bg-muted)}
.fmt-ext{display:inline-grid;place-items:center;min-width:44px;height:24px;padding:0 6px;border-radius:var(--r-sm);background:var(--bg-default);border:1px solid var(--border-default);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--fg-emphasis)}

/* ================= v17 · aligned to Agere DS 6.4 ================= */
/* DS 6.4 token names (values identical to the v15 --t-* aliases) */
:root{--error-on-surface:#811d1d;--attention-on-surface:#9b3412;--success-on-surface:#096738;--info-on-surface:#243c84;--special-on-surface:#4b1b98}
:root[data-theme="dark"]{--error-on-surface:#ff6467;--attention-on-surface:#fb923c;--success-on-surface:#36d399;--info-on-surface:#8197f8;--special-on-surface:#af94f9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--error-on-surface:#ff6467;--attention-on-surface:#fb923c;--success-on-surface:#36d399;--info-on-surface:#8197f8;--special-on-surface:#af94f9}}
:root,:root[data-theme="dark"]{--t-err:var(--error-on-surface);--t-att:var(--attention-on-surface);--t-ok:var(--success-on-surface)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t-err:var(--error-on-surface);--t-att:var(--attention-on-surface);--t-ok:var(--success-on-surface)}}
/* Block editor: type-display-lg title, type-body-lg body, heading-xl / heading-lg */
.nd-title{font-weight:600}
.nd-body{line-height:24px}
.nd-body h2{font-size:24px;line-height:32px}
.nd-body h3{font-size:20px;line-height:28px}
.nd-todo>li::before{top:4px}
/* Nested list: caret is IconButton xs (24 px) */
.cl-row .car,.cl-row .car-sp{width:24px;height:24px}
.cl-row .car{border-radius:var(--r-md)}
.cl-row .car svg{width:12px;height:12px}
/* group drop target: a real dashed outline (box-shadow cannot be dashed) */
.cl-gh.gdrop-on,.cl-empty.gdrop-on{box-shadow:none;outline:1.5px dashed var(--fg-emphasis);outline-offset:-2px;background:var(--bg-subtle);border-radius:var(--r-md)}
/* PageHeaderLeading: 48 px, radius xl (14 px) */
.phd>.ptile,.phd>.sk-ic,.phd>span.ptile{border-radius:var(--r-xl)!important}
/* RuleBuilderPreview icon: 32 px tile on bg-background */
.tg-preview .sk-ic{width:32px;height:32px;border-radius:var(--r-md);background:var(--bg-default)}
.tg-preview .sk-ic svg{width:16px;height:16px}
/* SaveBar: text-sm status with a 16 px icon */
.savebar .st{font-size:14px;line-height:20px}
.savebar .st svg{width:16px;height:16px}
/* SaveStatus: the saving icon spins, and stops with reduced motion */
.nd-status .spin-i{animation:spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.nd-status .spin-i,.spin{animation:none}}
.tg-preview .sk-ic{flex:none}
/* list rows: nothing before the name may shrink (long titles squeezed the status icon to 21 px) */
.cl-row .lead>*:not(.name){flex:none}
.cl-row .st-btn{flex:none}
/* shell rows are bounded: only #content scrolls; rail, panel and topbar stay put (regression since v14 safe-area change) */
.shell{grid-template-rows:minmax(0,1fr)}
.main,.inset,.panel,.guide-col{min-height:0}
/* task detail per UI-01 v2.4: property label 160 px, activity pane 400 px */
.prop{grid-template-columns:160px minmax(0,1fr)}
.tm-grid{grid-template-columns:minmax(0,1fr) 400px}
@media(max-width:900px){.tm-grid{grid-template-columns:1fr}}

/* ================= v18 · Agents (DD-1…DD-6) — Agere DS 6.4 tokens, 4-pt grid =================
   Exceptions (documented for DS 6.5): panel width 400 px (content measure for 1 agent run),
   approval-card min width 320 px (fits title + two buttons at 14 px). */
#agent-root[hidden]{display:none}
/* DD-1 launcher: extended FAB bottom-right, lifts above SaveBar, shifts left of Panduan */
.ag-fab{position:fixed;right:var(--ag-r,24px);bottom:var(--ag-b,24px);z-index:44;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px 0 16px;border-radius:var(--r-full);background:var(--brand-default);color:var(--brand-fg);font-size:14px;line-height:20px;font-weight:600;box-shadow:var(--shadow-elevation-4);transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease)}
.ag-fab:hover{box-shadow:var(--shadow-elevation-5);background:var(--brand-emphasis)}
.ag-fab:focus-visible{outline:2px solid var(--fg-emphasis);outline-offset:2px}
.ag-fab.icon{width:48px;padding:0;justify-content:center}
/* DD-2 panel: non-modal, docked above the launcher; bottom sheet on phones */
.ag-panel{position:fixed;right:var(--ag-r,24px);bottom:calc(var(--ag-b,24px) + 60px);z-index:44;width:400px;max-width:calc(100vw - 32px);max-height:min(640px,calc(100vh - var(--ag-b,24px) - 84px));display:flex;flex-direction:column;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--r-xl);box-shadow:var(--shadow-elevation-5);animation:dlg var(--dur-mod) var(--ease-emph)}
.ag-ph{display:flex;align-items:center;gap:4px;height:52px;padding:0 8px 0 16px;border-bottom:1px solid var(--border-default);flex:none}
.ag-pb{flex:1;overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.ag-comp{display:grid;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--border-default);flex:none}
.ag-comp textarea{width:100%;min-height:72px;resize:none;padding:8px 12px;border:1px solid var(--border-control);border-radius:var(--r-md);background:var(--bg-default);font:inherit;font-size:14px;line-height:20px;color:var(--fg-default)}
.ag-comp textarea:focus{outline:none;border-color:var(--fg-emphasis);box-shadow:0 0 0 3px var(--focus-halo)}
.ag-sug{display:flex;flex-wrap:wrap;gap:8px}
.chip.sm{height:24px;padding:0 10px;font-size:12px}
.ag-ctx{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.ag-chip{display:inline-flex;align-items:center;gap:4px;max-width:300px;height:24px;padding:0 4px 0 8px;border-radius:var(--r-md);background:var(--bg-subtle);font-size:12px;line-height:16px;font-weight:500;color:var(--fg-emphasis);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-chip-x{display:grid;place-items:center;width:16px;height:16px;border-radius:var(--r-sm);color:var(--fg-subtle);flex:none}
.ag-chip-x:hover{background:var(--bg-emphasis);color:var(--fg-emphasis)}
.ag-pend{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 12px;border-radius:var(--r-md);border:1px solid var(--attention-border,var(--border-default));background:var(--attention-bg);color:var(--attention-fg);font-size:13px;font-weight:500;text-align:left}
.ag-list{border:0;padding:0;margin:0;display:grid;gap:4px}
.ag-list legend{margin-bottom:4px}
.ag-opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;border-radius:var(--r-md);border:1px solid transparent;cursor:pointer}
.ag-opt:hover{background:var(--bg-muted)}
.ag-opt:has(input:checked){border-color:var(--border-emphasis);background:var(--bg-muted)}
.ag-opt:has(input:focus-visible){outline:2px solid var(--fg-emphasis);outline-offset:-2px}
.ag-opt input{position:absolute;opacity:0;pointer-events:none}
.ag-opt.off{opacity:.55;cursor:not-allowed}
/* DD-6 identity: agents are square tiles, people are round avatars */
.ag-tile{display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-md);background:var(--brand-default);color:var(--brand-fg);flex:none}
.ag-tile.sm{width:20px;height:20px;border-radius:var(--r-sm)}.ag-tile.sm svg{width:12px;height:12px}
.ag-tile.lg{width:36px;height:36px}.ag-tile.xl{width:48px;height:48px;border-radius:var(--r-xl)}.ag-tile.xl svg{width:20px;height:20px}
.av.ag-av{border-radius:var(--r-md);background:var(--brand-default);color:var(--brand-fg)}
.ag-badge{margin-left:4px}.ag-ap{margin-left:8px}
.ag-q{justify-self:end;max-width:85%;padding:8px 12px;border-radius:var(--r-lg);background:var(--bg-muted);font-size:14px;line-height:20px;color:var(--fg-emphasis)}
.rt{display:grid;gap:8px}
.rt-s{display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:var(--fg-subtle);animation:rtIn var(--dur-mod) var(--ease) both}
.rt-s:last-child{color:var(--fg-emphasis);font-weight:500}
.rt-dot{width:8px;height:8px;border-radius:50%;border:2px solid currentColor;flex:none}
.rt-s:last-child .rt-dot{background:currentColor}
.rt-s.err{color:var(--t-err)}
@keyframes rtIn{from{opacity:0;transform:translateY(4px)}}
.ag-ans{display:grid;gap:12px}
.ag-answer{font-size:14px;line-height:22px;color:var(--fg-emphasis)}
.ag-ask{display:grid;gap:8px;padding:12px;border-radius:var(--r-lg);border:1px solid var(--border-default)}
/* DD-4 evidence: label + icon + position, never colour alone */
.ev{display:grid;gap:8px}
.ev-g{display:grid;gap:4px;padding-left:12px;border-left:2px solid var(--border-default)}
.ev-k{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:600;color:var(--fg-emphasis)}
.ev-fact .ev-k svg{color:var(--t-ok)}.ev-inference .ev-k svg{color:var(--t-att)}.ev-recommendation .ev-k svg{color:var(--info-on-surface)}.ev-unknown .ev-k svg{color:var(--fg-subtle)}
.ev-g ul{display:grid;gap:4px}
.ev-g li{font-size:13px;line-height:20px;color:var(--fg-default)}
.ev-ref{display:inline-flex;align-items:center;height:20px;margin-left:6px;padding:0 6px;border:1px solid var(--border-default);border-radius:var(--r-sm);font-size:12px;font-weight:500;color:var(--fg-emphasis);vertical-align:1px}
.ev-ref:hover{border-color:var(--border-emphasis)}
/* DD-4 approval card */
.ac{display:grid;gap:8px;padding:12px 16px;border:1px solid var(--border-default);border-radius:var(--r-lg);background:var(--bg-surface)}
.ac-h{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:600;color:var(--fg-subtle)}
.ac-sum{font-size:14px;line-height:20px;font-weight:600;color:var(--fg-emphasis)}
.ac-text{padding:8px 12px;border-radius:var(--r-md);background:var(--bg-muted);font-size:14px;line-height:20px}
.ac-list{display:grid;gap:4px}.ac-list li{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px}
.ac-f{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--border-default)}
.ac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
/* DD-5 assisted marker: beside the title, never in the assignee column */
.ag-mark{display:inline-flex;align-items:center;gap:4px;height:20px;margin-left:8px;padding:0 6px;border-radius:var(--r-sm);background:var(--bg-subtle);color:var(--fg-subtle);font-size:11px;line-height:16px;font-weight:500;flex:none}
.ag-assisted{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;line-height:20px;margin-top:-12px}
.ib-ag .acts{opacity:1}
.run-meta{display:flex;flex-wrap:wrap;gap:8px}
/* DD-3 blueprint */
.bp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:start}
.bp-in,.bp-out{display:grid;gap:12px}
.bp-or{display:grid;gap:8px;margin-top:8px;padding-top:16px;border-top:1px solid var(--border-default)}
.bp-tpl{display:grid;gap:2px;padding:12px;border:1px solid var(--border-default);border-radius:var(--r-lg);text-align:left}
.bp-tpl:hover{border-color:var(--border-emphasis);background:var(--bg-muted)}
.bp-sec{display:grid;gap:8px}
.bp-k{font-size:13px;line-height:20px;font-weight:500;color:var(--fg-subtle)}
.bp-guard{display:grid;gap:4px;padding-left:20px;list-style:disc}.bp-guard li{font-size:14px;line-height:20px}
@media(max-width:1023px){.bp-grid{grid-template-columns:1fr}}
@media(max-width:767px){.ag-panel{left:0;right:0;bottom:0;width:100%;max-width:none;max-height:85vh;border-radius:var(--r-xl) var(--r-xl) 0 0}}
@media (prefers-reduced-motion:reduce){.rt-s,.ag-panel{animation:none}.ag-fab{transition:none}}
/* the launcher floats over content: pages get room to scroll their last row above it (PRD-17 §10.2) */
body.ag-on #content .page{padding-bottom:128px}

/* topbar search: English copy is longer; keep one line (UI-01 v2.5 text expansion) */
.cmd-btn .grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

const dayDiff=d=>Math.round((day0(d)-day0(NOW))/864e5);
const isWork=d=>d.getDay()>0&&d.getDay()<6&&!HOLIDAYS.some(h=>h.date===iso(d));
function bdBetween(a,b){const x=day0(a),y=day0(b);let k=0,s=x<y?1:-1;while(+x!==+y){x.setDate(x.getDate()+s);if(isWork(x))k+=s;}return k;}
const rp=n=>typeof S!=="undefined"&&S.lang==="en"?"IDR "+new Intl.NumberFormat("en-US",{maximumFractionDigits:0}).format(n):new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n).replace(/\s/g,"");
const member=k=>MEMBERS.find(m=>m.k===k);
const pname=k=>{if(!k)return"";if(k.startsWith("agent:")){const a=(typeof SKILLS!=="undefined"?SKILLS:[]).find(x=>x.id===k.slice(6));return a?a.name:"Agent";}if(k.startsWith("t-")){const t=TEAMS.find(t=>t.id===k);return t?"Tim "+t.name:k;}if(EXTERNAL[k])return EXTERNAL[k];const m=member(k);return m?(m.name||m.email):k;};
const first=k=>pname(k).split(" ")[0];
const initials=n=>n.replace(/\([^)]*\)/g,"").split(/[ .@]/).filter(w=>/^[A-Za-z]/.test(w)).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const me=()=>member(S.me);
const isAdmin=()=>["Owner","Admin"].includes(me().role);
const isOwner=()=>me().role==="Owner";
const projById=id=>PROJECTS.find(p=>p.id===id);
const spaceById=id=>SPACES.find(s=>s.id===id);
const teamById=id=>TEAMS.find(t=>t.id===id);
const taskById=id=>TASKS.find(t=>t.id===id);
const colOf=t=>projById(t.pid).cols.find(c=>c.id===t.col)||projById(t.pid).cols[0];
const catOf=t=>colOf(t).cat;
const isDone=t=>catOf(t)==="done";
const inTeam=(teamId,k=S.me)=>!!(teamById(teamId)||{members:[]}).members.includes(k);
function spaceView(s,k=S.me){if(s.access==="org")return true;return inTeam(s.team,k)||["Owner","Admin"].includes((member(k)||{}).role);}
function projAccessNat(p,k=S.me){const s=spaceById(p.space);if(p.access==="team")return inTeam(p.team,k);if(s.access==="org")return true;return inTeam(s.team,k);}
function canView(p,k=S.me){if(!p)return false;if(projAccessNat(p,k))return true;return ["Owner","Admin"].includes((member(k)||{}).role);}
const adminOverride=p=>!projAccessNat(p)&&isAdmin();
function accessLabel(p){const s=spaceById(p.space);if(p.access==="team")return{t:"Terbatas untuk Tim "+teamById(p.team).name,lock:true};if(s.access==="org")return{t:"Semua anggota",lock:false};return{t:"Ikut space, Tim "+teamById(s.team).name,lock:true};}
const visibleProjects=()=>PROJECTS.filter(p=>canView(p)&&!p.archived);
const tasksOf=pid=>TASKS.filter(t=>t.pid===pid&&!t.deleted);
function assigneeHas(t,k=S.me){if(!t.assignee)return false;if(t.assignee===k)return true;if(t.assignee.startsWith("t-"))return inTeam(t.assignee,k);return false;}
const myTasks=()=>TASKS.filter(t=>!t.deleted&&assigneeHas(t)&&canView(projById(t.pid))&&!projById(t.pid).archived);
const myOpen=()=>myTasks().filter(t=>!isDone(t));
function dueInfo(d,done){if(!d)return null;const n=dayDiff(d);if(done)return{t:fD(d),c:""};if(n<0)return{t:`Terlambat sejak ${fD(d)}`,c:"err-t",late:true};if(n===0)return{t:"Hari ini",c:"att-t"};if(n===1)return{t:"Besok",c:""};if(n<7)return{t:`${DAY[d.getDay()]}, ${fD(d)}`,c:""};return{t:fD(d),c:""};}
function slaInfo(r){if(r.status==="selesai")return{t:"Selesai",c:"muted",k:"done"};if(r.status==="tunggu")return{t:"SLA dijeda",c:"muted",k:"pause"};const b=bdBetween(NOW,r.due);if(r.due<NOW){const late=Math.max(1,-b);return{t:`Lewat SLA ${late} hari kerja`,c:"err-t",k:"late"};}if(b===0)return{t:`Jatuh tempo hari ini ${fT(r.due)}`,c:"att-t",k:"soon"};if(b===1)return{t:"Sisa 1 hari kerja",c:"att-t",k:"soon"};return{t:`Sisa ${b} hari kerja`,c:"",k:"ok"};}
const reqVisible=r=>isAdmin()||inTeam(r.team)||r.by===S.me||r.assignee===S.me;
const reqActionable=r=>isAdmin()||inTeam(r.team)||r.assignee===S.me;
const reqLate=()=>REQS.filter(r=>reqActionable(r)&&slaInfo(r).k==="late");
const myNotifs=()=>NOTIFS.filter(n=>!n.archived&&(n.to===S.me||(n.to==="*admin"&&isAdmin())));
const unreadN=()=>myNotifs().filter(n=>n.unread).length;
const deskBadge=()=>unreadN()+reqLate().length;
const chatUnread=()=>CHANNELS.filter(c=>c.kind!=="project"||canView(projById(c.pid))).reduce((a,c)=>a+c.unread,0);

 if(!$("#pop").innerHTML&&e.target.classList&&e.target.classList.contains("sel")&&["ArrowDown","ArrowUp","Enter"," "].includes(e.key)){e.preventDefault();openSel(e.target);return;}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if($("#ov .cmdk"))closeOv(true);else openCmdk();return;}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="b"){e.preventDefault();S.collapsed=!S.collapsed;S.peek=false;render();return;}
 if(e.key==="Escape"){if($("#pop").innerHTML){closePop();return;}if($("#ov").innerHTML){e.preventDefault();closeOv();return;}if(S.dock){S.dock=false;renderDock();return;}if(S.guide){S.guide=false;render();return;}if(S.navopen){S.navopen=false;render();return;}}
 if(typing||$("#ov").innerHTML)return;

 if(e.key==="?"){e.preventDefault();toggleGuide();return;}
 if(e.key.toLowerCase()==="n"&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!ROUTES[S.route].auth){e.preventDefault();newTaskDlg();return;}
 /* ARIA tabs: arrow keys */
 const tb=e.target.closest&&e.target.closest('[role="tablist"]');
 if(tb&&["ArrowLeft","ArrowRight","Home","End"].includes(e.key)){const ts=$$('[role="tab"]',tb);const i=ts.indexOf(e.target);let j=e.key==="ArrowRight"?(i+1)%ts.length:e.key==="ArrowLeft"?(i-1+ts.length)%ts.length:e.key==="Home"?0:ts.length-1;e.preventDefault();const k=ts[j].id||null;ts[j].click();setTimeout(()=>{const t2=$$('[role="tab"]',$('[role="tablist"]'))[j];t2&&t2.focus();},0);}
});

 const msg=!es.length?"Masukkan minimal satu email.":bad.length?`Format email belum benar: ${bad.join(", ")}`:dup.length?`${dup.join(", ")} sudah menjadi anggota atau sudah diundang.`:es.length>20?"Maks. 20 email sekaligus.":"";
 if(msg){t.setAttribute("aria-invalid","true");er.hidden=false;er.lastChild.textContent=msg;t.focus();return;}
 es.forEach(e=>MEMBERS.push({k:"u"+uid(),name:"",email:e,role:SELS["iv-r"].value,status:"diundang",joined:fDY(NOW),last:"Berlaku sampai 5 Okt 2026"}));S.onb.invite=true;closeOv(true);S.memberTab="undangan";render();toast(`${es.length} undangan terkirim.`);};

 openDlg(dlg({title:`Hapus ${m.name||m.email}?`,desc:"Akses dicabut segera. Pekerjaan yang masih berjalan perlu pemilik baru.",body:`

 ${open.length||led.length?`<div class="field"><span class="label" id="rw-l">Alihkan pekerjaan ke</span>${sel("rw",cand[0].k,cand.map(x=>({v:x.k,l:x.name||x.email,icon:av(x.k,"xs")})),markDirty,{labelledby:"rw-l"})}<p class="help">Hanya tugas di proyek yang bisa dibuka penerima akan dialihkan. Sisanya menjadi Belum ditugaskan.</p></div>`:`<p class="muted sm">Tidak ada pekerjaan yang perlu dialihkan.</p>`}`,

async function saveFile(filename,data){
 try{if(window.claude&&window.claude.use){const d=await window.claude.use("downloads");if(d){await d.save({filename,data});toast(`${filename} siap disimpan.`);return;}}}catch(e){if(e&&e.code==="declined"){toast("Unduhan dibatalkan.");return;}}
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/plain"}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast(`${filename} diunduh.`);}catch(e){toast("File belum bisa diunduh di tampilan ini.",{err:true});}
}

function htmlToMd(html){const el=document.createElement("div");el.innerHTML=html;const out=[];
 const inl=n=>[...n.childNodes].map(c=>c.nodeType===3?c.textContent:c.tagName==="B"||c.tagName==="STRONG"?`**${inl(c)}**`:c.tagName==="I"||c.tagName==="EM"?`*${inl(c)}*`:c.tagName==="CODE"?"`"+c.textContent+"`":c.classList&&c.classList.contains("nd-task")?`{${c.dataset.id}}`:inl(c)).join("");
 [...el.children].forEach(b=>{const t=b.tagName;if(t==="H2")out.push("## "+inl(b));else if(t==="H3")out.push("### "+inl(b));else if(t==="UL"&&b.classList.contains("nd-todo"))[...b.children].forEach(li=>out.push(`- [${li.dataset.checked==="true"?"x":" "}] ${inl(li)}`));else if(t==="UL")[...b.children].forEach(li=>out.push("- "+inl(li)));else if(t==="OL")[...b.children].forEach((li,i)=>out.push(`${i+1}. ${inl(li)}`));else if(t==="BLOCKQUOTE")out.push("> "+inl(b));else if(t==="PRE")out.push("```\n"+b.textContent+"\n```");else if(t==="HR")out.push("---");else out.push(inl(b));out.push("");});
 return out.join("\n").replace(/\n{3,}/g,"\n\n").trim()+"\n";}

/* ---------- weekly trend (Ringkasan) ---------- */
function trendCard(p){
 const seed=[...p.id].reduce((a,c)=>a+c.charCodeAt(0),0);const wk=["2026-08-24","2026-08-31","2026-09-07","2026-09-14","2026-09-21","2026-09-28"].map(x=>fD(D(x)));
 const made=wk.map((_,i)=>2+((seed*(i+3))%5));const done=wk.map((_,i)=>Math.max(0,made[i]-1+((seed+i)%3)-1));
 const mx=Math.max(...made,...done,1);const W=520,H=160,bw=18,gx=W/wk.length;
 const bars=wk.map((w,i)=>{const x=i*gx+gx/2;const h1=made[i]/mx*(H-24),h2=done[i]/mx*(H-24);return `<rect x="${x-bw-2}" y="${H-h1}" width="${bw}" height="${h1}" rx="3" fill="var(--chart-series-3)" opacity=".35"><title>${w}: ${made[i]} dibuat</title></rect><rect x="${x+2}" y="${H-h2}" width="${bw}" height="${h2}" rx="3" fill="var(--chart-series-3)"><title>${w}: ${done[i]} selesai</title></rect><text x="${x}" y="${H+18}" text-anchor="middle" font-size="11" fill="var(--fg-subtle)">${w}</text>`;}).join("");
 const tot=done.reduce((a,b)=>a+b,0),totm=made.reduce((a,b)=>a+b,0);
 return `<section class="card card-pad" style="display:grid;gap:16px"><div class="card-head"><h2 class="h2">Tren 6 minggu</h2><div class="row gap16 caption muted"><span class="row gap4"><i class="lg-sw" style="opacity:.35"></i>Dibuat ${totm}</span><span class="row gap4"><i class="lg-sw"></i>Selesai ${tot}</span></div></div>
 <svg viewBox="0 -4 ${W} ${H+26}" role="img" aria-label="${L("Tasks created and done per week","Tugas dibuat dan selesai per minggu")}: ${wk.map((w,i)=>L(`${w} ${made[i]} created ${done[i]} done`,`${w} ${made[i]} dibuat ${done[i]} selesai`)).join("; ")}" style="width:100%;height:auto">${[0.25,0.5,0.75,1].map(f=>`<line x1="0" x2="${W}" y1="${H-f*(H-24)}" y2="${H-f*(H-24)}" stroke="var(--border-default)" stroke-dasharray="2 4"/>`).join("")}<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--border-emphasis)"/>${bars}</svg>
 <p class="caption muted">${tot>=totm?"Tim menyelesaikan lebih cepat dari tugas masuk.":`Tugas masuk ${totm-tot} lebih banyak dari yang selesai. Periksa beban kerja di Daftar.`}</p></section>`;
}

 if(!ext){e.hidden=false;e.lastChild.textContent=`Format .${raw||"?"} belum didukung. Gunakan .md, .markdown, atau .txt.`;return;}
 if(f.size>1048576){e.hidden=false;e.lastChild.textContent="Ukuran file maksimal 1 MB.";return;}
 const r=new FileReader();r.onload=()=>{const txt=r.result;const base=f.name.replace(/\.[^.]+$/,"");let h=base,body;

function mdToHtml(md){const out=[];let list=null;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/`(.+?)`/g,"<code>$1</code>");
 const close=()=>{if(list){out.push(`</${list}>`);list=null;}};let code=null;
 md.split("\n").forEach(l=>{if(code!==null){if(/^```/.test(l)){out.push(`<pre>${esc(code.join("\n"))}</pre>`);code=null;}else code.push(l);return;}
  if(/^```/.test(l)){close();code=[];return;}
  let m;if((m=l.match(/^###\s+(.*)/))){close();out.push(`<h3>${inl(m[1])}</h3>`);}else if((m=l.match(/^##\s+(.*)/))){close();out.push(`<h2>${inl(m[1])}</h2>`);}
  else if((m=l.match(/^- \[( |x)\]\s+(.*)/i))){if(list!=="ul class=\"nd-todo\""){close();out.push('<ul class="nd-todo">');list='ul class="nd-todo"';}out.push(`<li data-checked="${m[1].toLowerCase()==="x"}">${inl(m[2])}</li>`);}

  else if((m=l.match(/^>\s?(.*)/))){close();out.push(`<blockquote>${inl(m[1])}</blockquote>`);}
  else if(/^---+$/.test(l.trim())){close();out.push("<hr>");}
  else if(l.trim()){close();out.push(`<p>${inl(l)}</p>`);}else close();});
 close();if(code!==null)out.push(`<pre>${esc(code.join("\n"))}</pre>`);
