<style>[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-default);color:var(--fg-default);font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;color:var(--fg-emphasis)}
.h-xl{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.01em}
.h-md{font-size:16px;line-height:24px;font-weight:600}
.h-sm{font-size:14px;line-height:20px;font-weight:600;color:var(--fg-emphasis)}
.caption{font-size:12px;line-height:16px}
.overline{font-size:10px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle)}
.muted{color:var(--fg-subtle)}
.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:focus-visible{outline:2px solid transparent;box-shadow:0 0 0 1px var(--focus-ring),0 0 0 4px rgba(115,115,115,.5);border-radius:8px}
.tag-rel{height:18px;padding:0 6px;font-size:10px;font-weight:600;letter-spacing:.04em;border-radius:6px}
.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:9999px;background:var(--bg-emphasis);color:var(--fg-emphasis);font-size:11px;font-weight:600;flex:none}

.pad{padding:24px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-weight:500;color:var(--fg-emphasis)}
.help{font-size:13px;line-height:18px;color:var(--fg-subtle)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--brand-default);flex:none}
.switch{position:relative;width:36px;height:20px;flex:none;appearance:none;background:var(--bg-emphasis);border-radius:9999px;cursor:pointer;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--bg-default);box-shadow:var(--shadow-elevation-1);transition:transform .15s}
.switch:checked{background:var(--brand-default)}
.switch:checked::after{transform:translateX(16px)}
.tablewrap{overflow-x:auto;border:1px solid var(--border-default);border-radius:14px;background:var(--bg-surface)}

th{text-align:left;font-size:12px;font-weight:500;color:var(--fg-subtle);background:var(--bg-muted);padding:10px 16px;border-bottom:1px solid var(--border-default);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--border-default);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover{background:var(--bg-subtle)}
.tab .cnt{font-size:12px;padding:0 6px;border-radius:9999px;background:var(--bg-subtle)}
.tab[disabled]{opacity:.5;cursor:default}
/* shell */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);height:100%}
.side{background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border-color);display:flex;flex-direction:column;min-height:0}
.side-head{padding:12px;border-bottom:1px solid var(--sidebar-border-color)}
.org{display:flex;gap:10px;align-items:center;padding:8px}
.org .logo{width:28px;height:28px;border-radius:8px;background:var(--brand-default);color:var(--brand-fg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.side-nav{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:18px}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp>.overline{padding:0 8px 6px}
.nav{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--fg-default);text-align:left;width:100%;font-weight:500}
.nav:hover{background:var(--sidebar-accent-bg)}
.nav[aria-current="page"]{background:var(--bg-emphasis);color:var(--fg-emphasis)}
.nav svg{color:var(--fg-subtle);flex:none}
.nav .end{margin-left:auto;display:flex;gap:4px;align-items:center}
.sub{padding-left:28px}
.sub .nav{min-height:30px;font-weight:400;font-size:13px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--border-default);background:var(--bg-default)}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--fg-subtle);min-width:0}
.crumbs b{color:var(--fg-emphasis);font-weight:500}
.urlchip{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--fg-subtle);background:var(--bg-muted);border:1px solid var(--border-default);padding:2px 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.content{flex:1;overflow:auto;padding:24px}
.page{display:flex;flex-direction:column;gap:24px}
.pagehead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.pagehead .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.menubtn{display:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:20px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:28px;line-height:36px;font-weight:600;color:var(--fg-emphasis);font-variant-numeric:tabular-nums}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;border:1px solid var(--info-border);background:var(--info-bg);color:var(--info-fg);font-size:13px;line-height:18px}
.note.warn{border-color:var(--attention-border);background:var(--attention-bg);color:var(--attention-fg)}
.note svg{flex:none;margin-top:1px}
/* sla chip */
.sla{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap}
.sla i{width:8px;height:8px;border-radius:50%;background:var(--fg-disabled);flex:none}
.sla.ok i{background:var(--success-solid)}.sla.soon i{background:var(--attention-solid)}.sla.late{color:var(--error-fg)}.sla.late i{background:var(--error-solid)}.sla.pause i{background:var(--info-solid)}
/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--bg-muted);border:1px solid var(--border-default);border-radius:14px;display:flex;flex-direction:column;min-width:0}
.colhead{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;flex-wrap:wrap}
.cards{display:flex;flex-direction:column;gap:8px;padding:4px 8px 10px}
.kcard{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:10px;padding:12px;box-shadow:var(--shadow-elevation-1);cursor:pointer;width:100%}
.kcard:hover{box-shadow:var(--shadow-elevation-3)}
.kcard .tt{font-weight:500;color:var(--fg-emphasis)}
.kcard .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--border-default);padding-top:8px}
/* stepper */
.stepper{list-style:none;margin:0;padding:0}
.grp-label{padding:16px 0 6px 40px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;position:relative}
.step::before{content:"";position:absolute;left:13.5px;top:0;bottom:0;width:1px;background:var(--border-default);z-index:0}
.step .dotn{width:28px;height:28px;border-radius:9999px;border:1px solid var(--border-default);background:var(--bg-surface);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;z-index:1;color:var(--fg-subtle)}
.step .dotn.late{border-color:var(--error-solid);background:var(--error-bg);color:var(--error-fg)}
.step .dotn.next{border:2px solid var(--brand-default);color:var(--fg-emphasis)}
.step .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* drawer & dialog */
.overlay{position:fixed;inset:0;z-index:60;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay.right{justify-content:flex-end;align-items:stretch;padding:0}
.dialog{width:100%;max-width:560px;max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column}
.drawer{background:var(--bg-surface);border-left:1px solid var(--border-default);width:560px;max-width:100%;height:100%;overflow:auto;display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--border-default)}
.db{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.df{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--border-default);flex-wrap:wrap;margin-top:auto}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 16px;align-items:center}
.kv dt{color:var(--fg-subtle);font-size:13px}
.kv dd{margin:0;min-width:0}
.ai{background:var(--special-bg);color:var(--special-fg);border-color:var(--special-border)}
.aifield{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 12px;align-items:center;padding:10px 12px;border:1px solid var(--border-default);border-radius:10px}
.aifield.need{border-color:var(--attention-border);background:var(--attention-bg)}
/* public pages */
.public{min-height:100%;background:var(--bg-muted);display:flex;flex-direction:column;align-items:center;padding:32px 16px;gap:16px}
.public .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
.hstep{display:flex;align-items:center;gap:8px}
.hstep .s{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-subtle);white-space:nowrap}
.hstep .s b{width:24px;height:24px;border-radius:50%;border:1px solid var(--border-control);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.hstep .s.done b{background:var(--success-solid);border-color:var(--success-solid);color:var(--success-on-solid)}
.hstep .s.on{color:var(--fg-emphasis);font-weight:500}
.hstep .s.on b{border:2px solid var(--brand-default)}
.hstep .ln{flex:1;height:1px;background:var(--border-default);min-width:16px}
.msg{display:flex;gap:10px}
.msg .bubble{background:var(--bg-muted);border:1px solid var(--border-default);border-radius:10px;padding:10px 12px;flex:1;min-width:0}
/* recipes */
.recipes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.recipe{padding:20px;display:flex;flex-direction:column;gap:12px}
.flow{display:flex;flex-direction:column;gap:6px;font-size:13px}
.flow div{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px}
.flow span:first-child{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--fg-subtle);padding-top:1px}
/* template onboarding */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border-default);border-radius:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--brand-default);background:var(--bg-subtle)}
.opt input{margin:3px 0 0;accent-color:var(--brand-default)}
.tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.tree li{display:flex;gap:8px;align-items:center}
.donut-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:8px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.placeholder{max-width:480px;margin:48px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.sk{background:linear-gradient(90deg,var(--bg-subtle),var(--bg-emphasis),var(--bg-subtle));background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:8px;height:16px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 24px;border:1px dashed var(--border-emphasis);border-radius:14px;background:var(--bg-muted)}
/* toasts & proto panel */
#toasts{position:fixed;right:16px;bottom:72px;z-index:80;display:flex;flex-direction:column;gap:8px;width:360px;max-width:calc(100vw - 32px)}
.toast{display:flex;gap:10px;align-items:center;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:10px;box-shadow:var(--shadow-elevation-5);padding:12px 14px}
#proto{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90}
#proto .toggle{display:inline-flex;gap:8px;align-items:center;height:36px;padding:0 14px;border-radius:9999px;border:0;background:var(--bg-inverted);color:var(--fg-inverted);cursor:pointer;font-weight:500;box-shadow:var(--shadow-elevation-4);white-space:nowrap}
#proto .toggle i{width:8px;height:8px;border-radius:50%;background:var(--brand-accent)}
#proto .panel{position:absolute;left:50%;transform:translateX(-50%);bottom:44px;width:320px;max-width:calc(100vw - 32px);background:var(--bg-surface);border:1px solid var(--border-default);border-radius:14px;box-shadow:var(--shadow-elevation-5);padding:16px;display:flex;flex-direction:column;gap:12px}
#proto .select{height:32px}
@media (prefers-reduced-motion:reduce){.sk{animation:none}.switch::after{transition:none}}
@media (max-width:1023px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.recipes,.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:767px){
 .shell{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:50;transform:translateX(-100%);transition:transform .2s}
 .shell.navopen .side{transform:none;box-shadow:var(--shadow-elevation-5)}
 .menubtn{display:inline-flex}
 .topbar{padding:0 16px;height:52px}
 .urlchip{display:none}
 .content{padding:16px}
 .kv,.aifield{grid-template-columns:minmax(0,1fr)}
 .board{grid-template-columns:repeat(4,84vw)}
 .step{grid-template-columns:28px minmax(0,1fr)}
 .step>.act{grid-column:2}
 .hide-sm{display:none}
}

/* ===== full version additions (Agere DS tokens only) ===== */
.pop{position:absolute;z-index:70;min-width:240px}
.pop .mi{width:100%;border:0;text-align:left;cursor:pointer;color:var(--fg-default);min-height:34px}

.pop .sep{height:1px;background:var(--border-default);margin:4px 0}
.side-head{position:relative}
.orgbtn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left}
.orgbtn:hover{background:var(--sidebar-accent-bg)}
.side-foot{padding:12px;border-top:1px solid var(--sidebar-border-color);position:relative}
.searchbtn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border:1px solid var(--border-control);border-radius:8px;background:var(--bg-default);color:var(--fg-subtle);cursor:pointer;min-width:200px;box-shadow:var(--shadow-elevation-1)}
.searchbtn span{flex:1;text-align:left}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--border-default);border-bottom-width:2px;border-radius:4px;font:500 11px/1 "Inter",system-ui,sans-serif;color:var(--fg-subtle);background:var(--bg-subtle)}
.bellwrap{position:relative}
.bellwrap .dotb{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--error-solid)}
.cmdk-ov{align-items:flex-start;padding-top:12vh}
.cmdk{max-width:640px;overflow:hidden}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-default);color:var(--fg-subtle)}
.cmdk-input{flex:1;border:0;background:none;height:32px;font-size:15px;color:var(--fg-emphasis);outline:none}
.cmdk-input:focus-visible{box-shadow:none}
.cmdk-list{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.cmdk-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left;color:var(--fg-default)}
.cmdk-item:hover,.cmdk-item.on{background:var(--bg-subtle);color:var(--fg-emphasis)}
.cmdk-foot{display:flex;gap:16px;padding:8px 16px;border-top:1px solid var(--border-default);background:var(--bg-muted)}
/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:12px;padding:20px;text-align:left;cursor:pointer;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:14px;box-shadow:var(--shadow-elevation-1);width:100%}
.pcard:hover{box-shadow:var(--shadow-elevation-3)}
.pcard .ft{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--border-default);padding-top:10px}
.progress{height:6px;border-radius:9999px;background:var(--bg-emphasis);overflow:hidden}
.progress span{display:block;height:100%;background:var(--task-complete-solid)}
.plogo{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--brand-default);color:var(--brand-fg);flex:none}
/* task modal (UI-01 detail item) */
.tmodal{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-elevation-5);width:100%;max-width:1440px;height:min(900px,calc(100% - 48px));display:flex;flex-direction:column;overflow:hidden}
.tbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border-default)}
.tbody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.tleft{overflow:auto;padding:24px 32px;display:flex;flex-direction:column;gap:20px}
.tright{background:var(--bg-subtle);border-left:1px solid var(--border-default);display:flex;flex-direction:column;min-height:0}
.tright .feed{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.tright .composer{padding:12px 16px;border-top:1px solid var(--border-default);display:flex;flex-direction:column;gap:8px}
.ttitle{font-size:24px;line-height:32px;font-weight:600;color:var(--fg-emphasis);border:0;background:none;width:100%;padding:4px 6px;margin-left:-6px;border-radius:6px}
.ttitle:hover{background:var(--bg-subtle)}
.props{display:grid;grid-template-columns:160px minmax(0,1fr) 160px minmax(0,1fr);gap:8px 12px;align-items:center}
.props dt{color:var(--fg-subtle);font-size:13px;display:flex;gap:8px;align-items:center}
.props dd{margin:0;min-width:0}
.act-item{display:flex;gap:10px;font-size:13px}
.checklist{display:flex;flex-direction:column;gap:6px}
/* share */
.principal{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-default)}
.principal:last-child{border-bottom:0}
.principal .select{width:130px;height:32px}
/* chat */
.chat{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%;margin:-24px;min-height:0}
.chatlist{border-right:1px solid var(--border-default);background:var(--bg-muted);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.chatmain{display:flex;flex-direction:column;min-height:0}
.chathead{min-height:56px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid var(--border-default)}
.chatlog{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.mrow{display:flex;gap:10px;max-width:720px}
.mrow .who{font-weight:600;color:var(--fg-emphasis);font-size:13px}
.mrow .mt{display:flex;flex-direction:column;gap:2px;min-width:0}
.mrow .actions{margin-left:auto;opacity:0}
.mrow:hover .actions,.mrow:focus-within .actions{opacity:1}
.mention{background:var(--brand-accent-subtle);color:var(--brand-accent);padding:0 3px;border-radius:4px;font-weight:500}
.taskref{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border-default);border-radius:10px;background:var(--bg-surface);margin-top:6px;max-width:420px}
.composer-bar{display:flex;gap:8px;padding:12px 24px;border-top:1px solid var(--border-default)}
/* doc */
.doclayout{display:grid;grid-template-columns:264px minmax(0,1fr);margin:-24px;height:calc(100% + 48px);min-height:0}
.doctree{border-right:1px solid var(--border-default);background:var(--bg-subtle);padding:16px 12px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.tnode{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px;border-radius:8px;border:0;background:none;width:100%;text-align:left;cursor:pointer;font-size:13px;color:var(--fg-default)}
.tnode:hover{background:var(--bg-muted)}
.tnode.on{background:var(--bg-emphasis);color:var(--fg-emphasis);font-weight:500}
.docmain{overflow:auto;padding:32px}
.docpage{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:24px}
.docpage h1{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.docpage h2{font-size:20px;line-height:28px;font-weight:600;margin-top:8px}
.docpage ul,.docpage ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.docpage .callout{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--bg-muted);border:1px solid var(--border-default)}
.embed{border:1px solid var(--border-default);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;background:var(--bg-surface)}
/* month calendar */
.cal{border:1px solid var(--border-default);border-radius:14px;overflow:hidden;background:var(--bg-surface)}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow div{padding:8px;font-size:12px;color:var(--fg-subtle);background:var(--bg-muted);border-bottom:1px solid var(--border-default);text-align:center}
.cal-grid .d{min-height:96px;border-right:1px solid var(--border-default);border-bottom:1px solid var(--border-default);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-grid .d:nth-child(7n){border-right:0}
.cal-grid .d.off{background:var(--bg-muted)}
.cal-grid .d.out{color:var(--fg-disabled)}
.cal-grid .d .n{font-size:12px;font-variant-numeric:tabular-nums}
.cal-grid .d.today .n{background:var(--brand-default);color:var(--brand-fg);border-radius:9999px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.ev{font-size:11px;line-height:16px;padding:2px 6px;border-radius:6px;background:var(--info-bg);color:var(--info-fg);border:0;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.late{background:var(--error-bg);color:var(--error-fg)}
.ev.req{background:var(--special-bg);color:var(--special-fg)}
.hol{font-size:10px;color:var(--attention-fg)}
/* settings */
.setgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px}
.setnav{display:flex;flex-direction:column;gap:2px}
.danger{border-color:var(--error-border)}

/* auth */
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-muted);padding:32px 16px}
.authcard{width:100%;max-width:420px;display:flex;flex-direction:column;gap:20px}
.or{display:flex;align-items:center;gap:12px;color:var(--fg-subtle);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border-default)}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.statepage{max-width:480px;margin:64px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
@media (max-width:1023px){.tbody{grid-template-columns:minmax(0,1fr)}.tright{border-left:0;border-top:1px solid var(--border-default)}.props{grid-template-columns:140px minmax(0,1fr)}}
@media (max-width:767px){
 .chat,.doclayout{grid-template-columns:minmax(0,1fr);margin:-16px}
 .chatlist,.doctree{display:none}
 .setgrid{grid-template-columns:minmax(0,1fr);gap:16px}
 .searchbtn{min-width:0}.searchbtn span,.searchbtn kbd{display:none}
 .tmodal{height:100%;border-radius:0}
 .tleft{padding:16px}
 .cal-grid .d{min-height:64px}
 .ev{font-size:10px}
}

#popl{position:fixed;inset:0;pointer-events:none;z-index:70}
#popl .pop{pointer-events:auto}
.linkbtn{color:var(--fg-emphasis)}
#content>.chat,#content>.doclayout{flex:1;min-height:0;height:auto}
.plain-row:hover{background:var(--bg-subtle)}

/* ===== v2: Space page (kartu proyek), timeline, doc markdown ===== */
.h-display{font-size:36px;line-height:44px;font-weight:700;letter-spacing:-.02em;color:var(--fg-emphasis)}
.slead{font-size:16px;line-height:26px;color:var(--fg-default);max-width:68ch}
.searchbox{position:relative}
.searchbox .si{position:absolute;left:12px;top:10px;color:var(--fg-subtle);display:flex;pointer-events:none}
.searchbox .input{padding-left:38px;height:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:9999px;border:1px solid var(--border-default);background:var(--bg-surface);color:var(--fg-emphasis);font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip .num{color:var(--fg-subtle);font-size:13px}

.chip[aria-pressed="true"]{background:var(--brand-default);color:var(--brand-fg);border-color:var(--brand-default)}
.chip[aria-pressed="true"] .num{color:var(--brand-fg);opacity:.75}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.scard{display:flex;flex-direction:column;gap:14px;padding:24px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:14px;min-width:0}

.sdetail{align-self:flex-start;margin-top:auto;border:0;background:none;padding:4px 0;font-weight:600;color:var(--fg-emphasis);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.sdetail:hover{text-decoration:underline;text-underline-offset:3px}
/* timeline */
.tl{display:grid;min-width:960px}
.tl-row{display:grid;grid-template-columns:220px repeat(var(--days),minmax(24px,1fr));align-items:center;position:relative;border-bottom:1px solid var(--border-default);min-height:40px}
.tl-head{min-height:32px;background:var(--bg-muted)}
.tl-name{padding:0 12px;font-size:13px;min-width:0;height:100%;display:flex;align-items:center;color:var(--fg-emphasis)}
.tl-day{font-size:11px;color:var(--fg-subtle);text-align:center;height:100%;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--border-default);font-variant-numeric:tabular-nums}
.tl-day span{white-space:nowrap}
.tl-cell{height:100%;border-left:1px solid var(--border-subtle)}
.tl-day.off,.tl-cell.off{background:var(--bg-muted)}
.tl-day.today,.tl-cell.today{box-shadow:inset 2px 0 0 var(--brand-default)}
.tl-bar{grid-row:1;height:24px;border-radius:6px;border:0;cursor:pointer;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:500;min-width:0;z-index:1;background:var(--task-in-progress-bg);color:var(--task-in-progress-fg)}
.tl-bar.todo{background:var(--task-todo-bg);color:var(--task-todo-fg)}
.tl-bar.done{background:var(--task-complete-bg);color:var(--task-complete-fg)}
.tl-bar.late{background:var(--error-bg);color:var(--error-fg);box-shadow:inset 0 0 0 1px var(--error-border)}
.tl-row>.tl-name{grid-row:1;grid-column:1}
.tl-row>.tl-cell{grid-row:1}
/* doc markdown */
.docbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;max-width:720px;margin:0 auto 24px;flex-wrap:wrap}
.docpage.md{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:26px;color:var(--fg-default)}
.docpage.md h1{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.docpage.md h2{font-size:21px;line-height:28px;font-weight:600;margin:16px 0 0}
.docpage.md h3{font-size:17px;line-height:24px;font-weight:600;margin:8px 0 0}
.docpage.md p{margin:0}
.docpage.md ul,.docpage.md ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:4px}
.docpage.md li.task{list-style:none;margin-left:-22px}
.docpage.md li.task input{margin:0 6px 0 0;accent-color:var(--brand-default)}
.docpage.md code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--bg-subtle);padding:1px 5px;border-radius:4px}
.docpage.md pre{margin:0;background:var(--bg-muted);border:1px solid var(--border-default);border-radius:10px;padding:12px 14px;overflow-x:auto}
.docpage.md pre code{background:none;padding:0;line-height:20px}
.docpage.md blockquote{margin:0;border-left:3px solid var(--border-emphasis);padding:2px 0 2px 14px;color:var(--fg-subtle)}
.docpage.md hr{border:0;border-top:1px solid var(--border-default);width:100%}
.docpage.md a{color:var(--fg-emphasis);text-decoration:underline;text-underline-offset:3px}
.docpage.md th,.docpage.md td{font-size:14px}
.docmain{position:relative}
.dropveil{position:absolute;inset:12px;border:2px dashed var(--brand-default);border-radius:14px;background:var(--bg-surface);opacity:.95;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--fg-emphasis);z-index:5}
@media (max-width:767px){.h-display{font-size:28px;line-height:36px}.sgrid{grid-template-columns:minmax(0,1fr)}}

/* --- ScrollArea DS (overlay) --- */
.sa-vp{scrollbar-width:none}.sa-vp::-webkit-scrollbar{display:none}
.ds-sbar{position:absolute;z-index:6;opacity:0;pointer-events:none;transition:opacity .25s}
.ds-sbar[data-state="visible"]{opacity:1;pointer-events:auto}
*:hover>.ds-sbar[data-state="idle"]{opacity:.6;pointer-events:auto}

.ds-sbar>div{cursor:default}
.ds-sbar>div:hover{background:var(--fg-disabled)}

.spot{outline:2px solid var(--brand-accent)!important;outline-offset:3px;border-radius:10px;animation:spotpulse 1.1s ease-out 2;position:relative;z-index:2}

/* ================= shared renderers ================= */
function slaInfo(r){
 const st=STAT[r.status];
 if(st.cat==="done"){const ok=!r.doneAt||r.doneAt<=r.due;return{cls:ok?"ok":"late",t:ok?"Selesai dalam SLA":"Selesai lewat SLA"};}
 if(st.pause)return{cls:"pause",t:"SLA dijeda: menunggu pemohon"};
 if(S.holidays.some(h=>h.date===iso(r.due)))return{cls:"soon",t:"Jatuh tempo di hari libur"};
 if(S.now>r.due){const n=bdBetween(r.due,S.now);return{cls:"late",t:n?`Lewat SLA ${n} hari kerja`:"Lewat SLA hari ini"};}
 if(iso(S.now)===iso(r.due))return{cls:"soon",t:`Jatuh tempo hari ini ${fTime(r.due)}`};
 const n=bdBetween(S.now,r.due);return{cls:n<=1?"soon":"ok",t:`Sisa ${n} hari kerja`};
}
function dueInfo(t){
 if(t.isR)return slaInfo(t);
 if(!t.due)return{cls:"",t:"Tanpa tenggat"};
 if(STAT[t.status].cat==="done")return{cls:"ok",t:"Selesai"};
 if(t.due<S.now&&iso(t.due)!==iso(S.now))return{cls:"late",t:`Terlambat · ${fShort(t.due)}`};
 if(iso(t.due)===iso(S.now))return{cls:"soon",t:`Hari ini ${fTime(t.due)}`};
 return{cls:"ok",t:fShort(t.due)};
}
const slaChip=r=>{const s=dueInfo(r);return `<span class="sla ${s.cls}"><i></i>${esc(s.t)}</span>`;};
const statBadge=k=>{const s=STAT[k];return `<span class="badge ${CAT[s.cat].c}">${esc(s.l)}</span>`;};
const prioChip=k=>{const p=PRIO[k||"normal"];return `<span class="caption" style="display:inline-flex;gap:4px;align-items:center;color:${k==="low"?"var(--fg-subtle)":"var(--fg-default)"}">${svg("flag",12).replace('stroke="currentColor"',`stroke="${p[1]}"`)}${p[0]}</span>`;};
const rel=(t,cls="")=>S.showRel?`<span class="badge tag-rel ${cls}">${esc(t)}</span>`:"";
const av=k=>`<span class="av" title="${esc(PEOPLE[k]||"")}">${ini(PEOPLE[k]||"?")}</span>`;

function stateWrap(fn){

function mdBlocks(md){

  if(/^\s*$/.test(l)){i++;continue;}
  let m;
  if(m=l.match(/^(#{1,6})\s+(.*)$/)){out.push({t:"h",level:m[1].length,text:m[2].trim()});i++;continue;}
  if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){out.push({t:"hr"});i++;continue;}
  if(/^>\s?/.test(l)){const buf=[];while(i<L.length&&/^>\s?/.test(L[i]))buf.push(L[i++].replace(/^>\s?/,""));out.push({t:"quote",text:buf.join(" ")});continue;}
  if(/^\s*\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\s*\|?\s*:?-{3,}/.test(L[i+1])){const row=s=>s.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());const rows=[row(l)];i+=2;while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i]))rows.push(row(L[i++]));out.push({t:"table",rows});continue;}
  if(/^\s*[-*+]\s+/.test(l)){const items=[];while(i<L.length&&/^\s*[-*+]\s+/.test(L[i])){let x=L[i++].replace(/^\s*[-*+]\s+/,"");let chk=null;const c=x.match(/^\[([ xX])\]\s+(.*)$/);if(c){chk=c[1]!==" ";x=c[2];}items.push({text:x,chk});}out.push({t:"ul",items});continue;}
  if(/^\s*\d+[.)]\s+/.test(l)){const items=[];while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i]))items.push({text:L[i++].replace(/^\s*\d+[.)]\s+/,"")});out.push({t:"ol",items});continue;}
  const buf=[l];i++;while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#{1,6}\s|```|>|\s*[-*+]\s|\s*\d+[.)]\s|\s*\|)/.test(L[i]))buf.push(L[i++]);out.push({t:"p",text:buf.join(" ")});
 }

function parseDate(s){
 s=(s||"").trim();let m;
 if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))return mk(+m[1],+m[2]-1,+m[3]);
 if(m=s.match(/^(\d{1,2})[/.](\d{1,2})[/.](\d{4})$/))return mk(+m[3],+m[2]-1,+m[1]);
 if(m=s.match(/^(?:\w+,\s*)?(\d{1,2})\s+([A-Za-z]+)\.?\s+(\d{4})$/)){const mo=MONMAP[m[2].toLowerCase()];if(mo!==undefined)return mk(+m[3],mo,+m[1]);}
 return null;
 function mk(y,mo,d){const x=new Date(y,mo,d,9,0,0);return x.getMonth()===mo&&x.getDate()===d?x:null;}
}
function matchPerson(s){
 const q=(s||"").trim().replace(/^@/,"").toLowerCase();if(!q)return{k:null};
 const act=MEMBERS.filter(m=>m.status==="aktif"&&m.name);
 const exact=act.filter(m=>m.name.toLowerCase()===q||m.email.toLowerCase()===q);if(exact.length===1)return{k:exact[0].k};
 const first=act.filter(m=>m.name.toLowerCase().split(" ")[0]===q||m.name.toLowerCase().startsWith(q));
 if(first.length===1)return{k:first[0].k};
 if(first.length>1)return{k:null,warn:`"${s}" cocok dengan ${first.length} orang (${first.map(m=>m.name).join(", ")}). Dibuat tanpa PJ.`};
 return{k:null,warn:`"${s}" bukan anggota aktif. Dibuat tanpa PJ.`};
}
const STATMAP={baru:"baru","to do":"baru",todo:"baru","belum mulai":"baru",dikerjakan:"kerja","in progress":"kerja",berjalan:"kerja",proses:"kerja",review:"review",selesai:"selesai",done:"selesai"};
function tlParse(md,kickoff){
 const blocks=mdBlocks(md);const title=(blocks.find(b=>b.t==="h")||{}).text;
 const tbl=blocks.find(b=>b.t==="table");const rows=[];
 const H=k=>k.toLowerCase().replace(/[^a-z ]/g,"").trim();
 const pick=(hdr,names)=>hdr.findIndex(h=>names.includes(H(h)));
 if(tbl){
  const hdr=tbl.rows[0];
  const iT=pick(hdr,["tugas","fase","judul","item","task","phase","pekerjaan"]),iS=pick(hdr,["mulai","start","tanggal mulai"]),iE=pick(hdr,["selesai","tenggat","akhir","end","due","deadline","tanggal selesai"]),iW=pick(hdr,["minggu","weeks","week","pekan"]),iP=pick(hdr,["pj","penanggung jawab","owner","assignee","pic"]),iSt=pick(hdr,["status"]);
  tbl.rows.slice(1).forEach((r,n)=>rows.push(tlRow({line:n+1,title:r[iT>=0?iT:0],s:iS>=0?r[iS]:"",e:iE>=0?r[iE]:"",w:iW>=0?r[iW]:"",p:iP>=0?r[iP]:"",st:iSt>=0?r[iSt]:"",extra:hdr.map((h,ci)=>[iT,iS,iE,iW,iP,iSt].includes(ci)||ci===0&&iT<0?"":r[ci]?`${h}: ${r[ci]}`:"").filter(Boolean).join(" · ")},kickoff)));
 }else{
  blocks.filter(b=>b.t==="ul"||b.t==="ol").flatMap(b=>b.items).forEach((it,n)=>{
   const t=it.text;const m=t.match(/(.+?)\s*[(:]\s*([^()→]+?)\s*(?:→|->|–|—|s\.?d\.?|sampai)\s*([^()@]+?)\s*\)?\s*(?:@(\S+))?\s*$/);
   const w=t.match(/(.+?)\s*[(:]\s*(W\d+\s*[–-]\s*W?\d+|W\d+)\s*\)?\s*(?:@(\S+))?\s*$/i);
   if(w)rows.push(tlRow({line:n+1,title:w[1],w:w[2],p:w[3]||"",st:it.chk?"selesai":""},kickoff));
   else if(m)rows.push(tlRow({line:n+1,title:m[1],s:m[2],e:m[3],p:m[4]||"",st:it.chk?"selesai":""},kickoff));
   else rows.push({line:n+1,title:mdPlain(t),err:"Tidak ada tanggal. Tulis seperti: Judul (2026-10-05 → 2026-10-09) @nama"});
  });
 }
 return{title,rows,usesWeeks:rows.some(r=>r.weeks)};
}
function tlRow(x,kickoff){
 const r={line:x.line,title:mdPlain((x.title||"").trim()),desc:x.extra||"",warns:[]};
 if(!r.title){r.err="Judul kosong";return r;}
 let s=null,e=null;
 const w=(x.w||"").match(/W(\d+)\s*(?:[–-]\s*W?(\d+))?/i);
 if(w){r.weeks=true;const a=+w[1],b=+(w[2]||w[1]);s=new Date(kickoff);s.setDate(s.getDate()+(a-1)*7);e=new Date(kickoff);e.setDate(e.getDate()+(b-1)*7+4);if(b<a){r.err="Minggu akhir lebih awal dari minggu mulai";return r;}}
 else{s=parseDate(x.s);e=parseDate(x.e);if(!s&&!e){r.err="Tanggal tidak dikenali. Pakai 2026-10-05, 05/10/2026, atau 5 Okt 2026";return r;}
  if(!e){e=s;r.warns.push("Tanpa tanggal selesai: dibuat 1 hari.");}if(!s){s=new Date(e);r.warns.push("Tanpa tanggal mulai: dimulai di hari tenggat.");}
  if(e<s){r.err=`Selesai (${fShort(e)}) lebih awal dari mulai (${fShort(s)})`;return r;}}
 e.setHours(17,0,0,0);r.start=s;r.due=e;
 const pm=matchPerson(x.p);r.assignee=pm.k;if(pm.warn)r.warns.push(pm.warn);
 const st=(x.st||"").trim().toLowerCase();r.status=STATMAP[st]||"baru";if(st&&!STATMAP[st])r.warns.push(`Status "${x.st}" tidak dikenal: dibuat sebagai Baru.`);
 return r;
}

function timeline(items){
 const withDue=items.filter(i=>i.due);
 const s0=withDue.reduce((m,i)=>{const s=i.start||(i.isR?i.created:new Date(i.due.getTime()-3*864e5));return s<m?s:m;},new Date(S.now.getTime()-7*864e5));
 const e0=withDue.reduce((m,i)=>i.due>m?i.due:m,new Date(S.now.getTime()+14*864e5));
 const start=new Date(s0);start.setHours(0,0,0,0);start.setDate(start.getDate()-((start.getDay()+6)%7));
 const days=Math.min(182,Math.max(28,Math.ceil((e0-start)/864e5)+7));
 const cols=[...Array(days)].map((_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d;});
 const rows=withDue.map(i=>{const st=i.start||(i.isR?i.created:new Date(i.due.getTime()-3*864e5));const a=Math.max(0,Math.floor((st-start)/864e5));const b=Math.min(days-1,Math.floor((i.due-start)/864e5));return{i,a,b};}).filter(r=>r.b>=0&&r.a<days).sort((x,y)=>x.a-y.a||x.b-y.b);
 const today=Math.floor((S.now-start)/864e5);
 const bar=`<div class="row" style="justify-content:space-between"><div class="btn-group" role="group" aria-label="Impor timeline"><button class="btn btn-sm" data-v3="tl-import">${svg("upload",14)}Impor dari .md</button><button class="btn btn-sm" data-v3="tl-sample">${svg("download",14)}Contoh format</button><button class="btn btn-sm" data-v3="tl-sample-w">${svg("download",14)}Contoh minggu (W1–W22)</button></div><span class="caption muted">${rows.length} item · ${fShort(cols[0])} – ${fShort(cols[days-1])} ${cols[days-1].getFullYear()}</span></div>`;
 return `${bar}<div class="tablewrap" id="tldrop" style="position:relative"><div class="tl" style="--days:${days};min-width:${220+days*26}px">

function mdToEditBlocks(md){
 const out=[];mdBlocks(md).forEach(b=>{
  if(b.t==="h")out.push({t:"h",level:Math.min(b.level,3),text:b.text});
  else if(b.t==="p")out.push({t:"p",text:b.text});
  else if(b.t==="ul")b.items.forEach(x=>out.push(x.chk===null?{t:"li",text:x.text}:{t:"todo",text:x.text,chk:x.chk}));
  else if(b.t==="ol")b.items.forEach(x=>out.push({t:"num",text:x.text}));
  else if(b.t==="quote")out.push({t:"quote",text:b.text});
  else if(b.t==="code")out.push({t:"code",text:b.text});
  else if(b.t==="hr")out.push({t:"hr"});
  else if(b.t==="table")out.push({t:"table",rows:b.rows.map(r=>r.slice())});
 });
 return out.length?out:[{t:"p",text:""}];
}
function blocksToMd(bl){
 const parts=[];let n=0;
 bl.forEach((b,i)=>{const prev=bl[i-1];const list=["li","num","todo"].includes(b.t);const sameList=prev&&list&&(prev.t===b.t||(["li","todo"].includes(prev.t)&&["li","todo"].includes(b.t)));
  if(b.t==="num")n=prev&&prev.t==="num"?n+1:1;
  let s;
  if(b.t==="h")s="#".repeat(b.level)+" "+b.text;else if(b.t==="p"){if(!b.text.trim())return;s=b.text;}
  else if(b.t==="li")s="- "+b.text;else if(b.t==="todo")s=`- [${b.chk?"x":" "}] `+b.text;else if(b.t==="num")s=`${n}. `+b.text;
  else if(b.t==="quote")s="> "+b.text;else if(b.t==="code")s="```\n"+b.text+"\n```";else if(b.t==="hr")s="---";
  else if(b.t==="table"){const r=b.rows;s=["| "+r[0].join(" | ")+" |","| "+r[0].map(()=>"---").join(" | ")+" |",...r.slice(1).map(x=>"| "+x.join(" | ")+" |")].join("\n");}
  if(sameList&&parts.length)parts[parts.length-1]+="\n"+s;else parts.push(s);
 });
 return parts.join("\n\n")+"\n";
}

 keepRender({i:Math.max(0,i-1),at:"end"});
 const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.innerHTML=`${svg("trash")}<span>Blok dihapus.</span><button class="btn btn-ghost btn-sm" data-v4="undo" style="margin-left:auto">Urungkan</button>`;document.getElementById("toasts").appendChild(el);setTimeout(()=>el.remove(),6000);
}

 switch(v.v4){
  case"openproj":go("proyek",{pid:v.pid,tab:"doc"});break;
  case"pdocsel":S.pdoc[v.pid]=v.id;S.doc=v.id;keepRender();break;

  case"importproj":S.importPid=v.pid;document.getElementById("pdocfile").click();break;

  case"linkproj":renderOv(linkProjDialog());break;
  case"linkproj-ok":{d.projects=[...document.querySelectorAll(".lp-cb:checked")].map(x=>x.value);closeOv();keepRender();toast(`Doc tertaut ke ${d.projects.length} proyek.`);break;}
  case"unlink":{d.projects=d.projects.filter(x=>x!==v.pid);delete S.pdoc[v.pid];keepRender();toast(`"${docTitle(d)}" dilepas dari ${projById(v.pid).name}. Doc-nya tidak dihapus.`);break;}
  case"toggleedit":S.editDoc=S.editDoc===d.id?null:d.id;keepRender(S.editDoc?{i:0,at:"end"}:null);break;
  case"detach":{d.origin=d.src.file;d.src=null;const md=d.md();d.blocks=mdToEditBlocks(md);d.md=()=>blocksToMd(d.blocks);S.editDoc=d.id;touch(d);keepRender();toast("Doc sekarang bisa diedit. Perubahan di file .md tidak lagi disinkronkan.");break;}
  case"add":{const b=t.getBoundingClientRect();setPop(typeMenu(+v.i,"insert",Math.max(8,b.left),Math.min(b.bottom+4,innerHeight-360)));break;}
  case"addend":{d.blocks.push({t:"p",text:""});touch(d);keepRender({i:d.blocks.length-1});break;}
  case"handle":{const b=t.getBoundingClientRect();setPop(handleMenu(+v.i,Math.max(8,b.left),Math.min(b.bottom+4,innerHeight-240)));break;}
  case"settype":{const i=+v.i;setPop(null);
   if(v.mode==="insert"){d.blocks.splice(i+1,0,newBlock(v.type));touch(d);keepRender({i:i+1});}
   else{const b=d.blocks[i];const hasText=(b.text||"").trim();if((v.type==="hr"||v.type==="table")&&hasText){d.blocks.splice(i+1,0,newBlock(v.type));}else setType(b,v.type);touch(d);keepRender({i,at:"end"});}
   break;}
  case"bop":{const i=+v.i;setPop(null);const bl=d.blocks;
   if(v.op==="up"&&i>0){[bl[i-1],bl[i]]=[bl[i],bl[i-1]];touch(d);keepRender({i:i-1,at:"end"});}
   else if(v.op==="down"&&i<bl.length-1){[bl[i+1],bl[i]]=[bl[i],bl[i+1]];touch(d);keepRender({i:i+1,at:"end"});}
   else if(v.op==="dup"){bl.splice(i+1,0,JSON.parse(JSON.stringify(bl[i])));touch(d);keepRender({i:i+1,at:"end"});}
   else if(v.op==="type"){const el=document.querySelector(`.blk[data-i="${i}"]`).getBoundingClientRect();setPop(typeMenu(i,"convert",Math.max(8,el.left),Math.min(el.bottom+4,innerHeight-360)));}
   else if(v.op==="del")delBlock(d,i);
   break;}
  case"tbl":{const b=d.blocks[+v.i];const r=b.rows;
   if(v.op==="row+")r.push(r[0].map(()=>""));else if(v.op==="col+")r.forEach((x,k)=>x.push(k?"":"Kolom "+(x.length+1)));
   else if(v.op==="row-"&&r.length>2)r.pop();else if(v.op==="col-"&&r[0].length>1)r.forEach(x=>x.pop());
   touch(d);keepRender();break;}
  case"undo":{const u=S.undo;const dd=MDDOCS.find(x=>x.id===u.id);if(dd){dd.blocks.splice(u.i,0,u.b);touch(dd);S.undo=null;t.closest(".toast").remove();keepRender({i:u.i,at:"end"});toast("Blok dikembalikan.");}break;}
 }
},true);

 if(t.dataset.cell){const [i,r,c]=t.dataset.cell.split(",").map(Number);d.blocks[i].rows[r][c]=t.innerText.replace(/\n/g," ").trim();touch(d);return;}
 if(t.dataset.be===undefined)return;
 const i=+t.dataset.be;const b=d.blocks[i];b.text=t.innerText.replace(/\n$/,"");
 if(b.t==="p"){const sc=[[/^###\s/,"h3"],[/^##\s/,"h2"],[/^#\s/,"h1"],[/^[-*]\s/,"li"],[/^1[.)]\s/,"num"],[/^\[\s?\]\s/,"todo"],[/^>\s/,"quote"],[/^```$/,"code"],[/^---$/,"hr"]];
  for(const [re,k] of sc)if(re.test(b.text)){const rest=b.text.replace(re,"");setType(b,k);if(k==="hr"){d.blocks.splice(i+1,0,{t:"p",text:""});touch(d);keepRender({i:i+1});return;}b.text=k==="code"?"":rest;touch(d);keepRender({i,at:"end"});return;}}
 touch(d);
 const cap=document.querySelector(".docbar .caption.muted");if(cap&&!cap.innerHTML.includes("Tersimpan"))cap.insertAdjacentHTML("beforeend",' · <span style="color:var(--success-fg)">Tersimpan</span>');
});
document.addEventListener("keydown",e=>{
 const t=e.target;if(!t.dataset||t.dataset.be===undefined)return;const d=curDoc();if(!d||!d.blocks)return;
 const i=+t.dataset.be;const b=d.blocks[i];const off=caretOffset(t);const txt=t.innerText.replace(/\n$/,"");
 if(e.key==="/"&&!txt){e.preventDefault();const r=t.getBoundingClientRect();setPop(typeMenu(i,"convert",Math.max(8,r.left),Math.min(r.bottom+4,innerHeight-360)));return;}
 if(e.key==="Enter"&&!e.shiftKey&&b.t!=="code"){e.preventDefault();
  const list=["li","num","todo"].includes(b.t);
  if(list&&!txt){setType(b,"p");touch(d);keepRender({i});return;}
  b.text=txt.slice(0,off);const nb={t:list?b.t:"p",text:txt.slice(off)};if(b.t==="todo")nb.chk=false;d.blocks.splice(i+1,0,nb);touch(d);keepRender({i:i+1,at:0});return;}
 if(e.key==="Backspace"&&off===0&&!getSelection().toString()){
  if(!txt&&d.blocks.length>1){e.preventDefault();delBlock(d,i);return;}
  if(txt&&b.t!=="p"&&b.t!=="code"){e.preventDefault();setType(b,"p");touch(d);keepRender({i,at:0});return;}
  if(txt&&b.t==="p"&&i>0&&d.blocks[i-1].text!==undefined&&!["table","code"].includes(d.blocks[i-1].t)){e.preventDefault();const prev=d.blocks[i-1];const at=prev.text.length;prev.text+=txt;d.blocks.splice(i,1);touch(d);keepRender({i:i-1,at});return;}
 }
 if(e.key==="ArrowUp"&&off===0&&i>0){const el=document.querySelector(`[data-be="${i-1}"]`);if(el){e.preventDefault();el.focus();setCaret(el,el.innerText.length);}}
 if(e.key==="ArrowDown"&&off>=txt.length){const el=document.querySelector(`[data-be="${i+1}"]`);if(el){e.preventDefault();el.focus();setCaret(el,0);}}
 if(e.key==="Escape"){S.editDoc=null;keepRender();}

const add=(el,s)=>{if(!el.dataset.ds){el.classList.add(...s.split(" ").filter(Boolean));el.dataset.ds="1";}};
function dsify(root){
 if(!root||!root.querySelectorAll)return;
 root.querySelectorAll(".btn-group:not([data-ds])").forEach(g=>add(g,"inline-flex flex-row items-stretch isolate shadow-xs rounded-md"));
 root.querySelectorAll(".btn:not([data-ds])").forEach(b=>{const c=b.classList;const v=b.parentElement&&b.parentElement.classList.contains("btn-group")?"outline":c.contains("btn-primary")?"default":c.contains("btn-danger")?"destructive":c.contains("btn-ghost")?"ghost":c.contains("btn-secondary")?"secondary":"outline";const ic=c.contains("icon-btn");const s=ic?(c.contains("btn-sm")?"icon-sm":"icon"):c.contains("btn-sm")?"sm":"md";add(b,`${DS.btn} ${DS.bv[v]} ${DS.bs[s]}`);});
 root.querySelectorAll(".badge:not([data-ds])").forEach(b=>{const c=b.classList;const v=["info","success","attention","error","special"].find(k=>c.contains("b-"+k))||"secondary";add(b,`${DS.badge} ${DS.bdv[v]}`);});
 root.querySelectorAll("input.input:not([data-ds]),select.select:not([data-ds])").forEach(i=>add(i,`${DS.input} h-9 py-1`));
 root.querySelectorAll("textarea.textarea:not([data-ds]),textarea.input:not([data-ds])").forEach(i=>add(i,`${DS.input} h-auto min-h-16 py-2`));
 root.querySelectorAll(".card:not([data-ds])").forEach(c=>add(c,DS.card+(c.matches("button,[role=button],[data-proj],[data-space]")?" "+DS.cardI:"")));
 root.querySelectorAll(".dialog:not([data-ds])").forEach(d=>add(d,DS.dialog));
 root.querySelectorAll(".pop:not([data-ds])").forEach(d=>add(d,DS.menu));
 root.querySelectorAll(".pop .mi:not([data-ds])").forEach(d=>add(d,DS.mi));
 root.querySelectorAll(".seg:not([data-ds])").forEach(d=>add(d,DS.ulist));
 root.querySelectorAll(".seg>button").forEach(b=>{add(b,DS.utrig);b.dataset.state=(b.getAttribute("aria-selected")==="true"||b.getAttribute("aria-pressed")==="true")?"active":"inactive";});
 root.querySelectorAll(".tabs:not([data-ds])").forEach(d=>add(d,DS.ulist));
 root.querySelectorAll(".tabs>.tab").forEach(b=>{add(b,DS.utrig);b.dataset.state=b.getAttribute("aria-selected")==="true"?"active":"inactive";});
 root.querySelectorAll("table:not([data-ds])").forEach(t=>{add(t,DS.table);t.querySelectorAll("tbody tr").forEach(r=>add(r,DS.tr));});
}
/* Switch DS (Radix: button role=switch + data-state) */
const dsSwitch=(id,on,label,extra="")=>`<button type="button" role="switch" id="${id}" class="${DS.sw}" data-state="${on?"checked":"unchecked"}" aria-checked="${on}" aria-label="${esc(label)}" ${extra}><span class="${DS.thumb}" data-state="${on?"checked":"unchecked"}"></span></button>`;
/* ScrollArea DS: scrollbar overlay 10px, thumb rounded-full bg-border (pengganti scrollbar CSS native) */
function scrollArea(el){
 if(!el||el.dataset.sa)return;el.dataset.sa="1";el.classList.add("sa-vp");
 const host=el.parentElement;if(getComputedStyle(host).position==="static")host.style.position="relative";
 const bar=document.createElement("div");bar.className=DS.sbar;bar.setAttribute("aria-hidden","true");bar.innerHTML=`<div class="${DS.sthumb}"></div>`;host.appendChild(bar);
 const th=bar.firstChild;let hideT;
 const upd=()=>{const r=el.getBoundingClientRect(),h=host.getBoundingClientRect();bar.style.top=(r.top-h.top)+"px";bar.style.height=r.height+"px";bar.style.left=(r.right-h.left-10)+"px";
  const ratio=el.clientHeight/el.scrollHeight;if(ratio>=1){bar.dataset.state="hidden";return;}
  const tH=Math.max(24,ratio*(el.clientHeight-2));th.style.height=tH+"px";th.style.flex="none";th.style.transform=`translateY(${(el.scrollTop/(el.scrollHeight-el.clientHeight))*(el.clientHeight-2-tH)}px)`;};
 const show=()=>{upd();if(bar.dataset.state==="hidden"&&el.clientHeight>=el.scrollHeight)return;bar.dataset.state="visible";clearTimeout(hideT);hideT=setTimeout(()=>{if(!host.matches(":hover"))bar.dataset.state="idle";},900);};
 el.addEventListener("scroll",show,{passive:true});host.addEventListener("mouseenter",show);host.addEventListener("mouseleave",()=>{bar.dataset.state="idle";});
 new ResizeObserver(upd).observe(el);upd();bar.dataset.state=bar.dataset.state||"idle";
 let drag=null;th.addEventListener("pointerdown",e=>{drag={y:e.clientY,s:el.scrollTop};th.setPointerCapture(e.pointerId);e.preventDefault();});
 th.addEventListener("pointermove",e=>{if(!drag)return;const k=(el.scrollHeight-el.clientHeight)/(el.clientHeight-th.offsetHeight);el.scrollTop=drag.s+(e.clientY-drag.y)*k;});
 th.addEventListener("pointerup",()=>drag=null);
}

 const roles=[["all","Semua"],...[...new Set(PLAYBOOKS.map(p=>p.role))].map(r=>[r,r])];

 const flows=`<div class="g-chips" role="toolbar" aria-label="Pilih peran">${roles.map(([k,l])=>`<button class="chip" data-v8="grole" data-k="${k}" aria-pressed="${S.gRole===k}">${l}</button>`).join("")}</div>
 <div class="g-list">${pbs.map(p=>{const done=p.steps.filter((_,i)=>S.gdone[p.id+i]).length;const open=S.gPb===p.id;return `<article class="g-pb" data-open="${open}"><button class="g-pbh" data-v8="gpb" data-k="${p.id}" aria-expanded="${open}"><span class="stack" style="gap:6px;min-width:0"><span class="row" style="gap:8px"><span class="badge">${esc(p.role)}</span><span class="caption muted">${esc(p.dur)}</span></span><b class="g-pbt">${esc(p.t)}</b></span><span class="g-ring" style="--p:${done/p.steps.length}" aria-label="${done} dari ${p.steps.length} langkah selesai"><span class="num">${done}/${p.steps.length}</span></span></button>

 return `<aside class="guide" aria-label="Panduan" id="guide"><div class="g-head"><span class="g-ic" aria-hidden="true">${svg("book",16)}</span><div class="stack grow" style="gap:0"><h2 class="g-title">Panduan</h2><span class="caption muted">Cara pakai dan alur kerja</span></div><button class="btn btn-ghost btn-sm icon-btn" data-v8="guide" aria-label="Tutup panduan">${svg("x",16)}</button></div>

 <div class="g-body">${S.gTab==="howto"?howto:flows}</div>
 <div class="g-foot caption muted"><kbd>?</kbd> buka atau tutup panduan · <kbd>Alt</kbd>+<kbd>1</kbd>…<kbd>${RAIL.length+1}</kbd> pindah menu</div></aside>`;
}
function spotlight(sel){
 const el=sel.split(",").map(s=>document.querySelector("#content "+s.trim())||document.querySelector(".nav2 "+s.trim())||document.querySelector(s.trim())).find(Boolean)||document.querySelector("#content .pagehead")||document.getElementById("content");

function enhanceSelects(root){
 (root||document).querySelectorAll("select:not([data-dsel])").forEach(sel=>{
  if(sel.multiple||sel.closest(".ds-lb"))return;
  sel.dataset.dsel="1";
  const t=document.createElement("button");t.type="button";
  t.className=[...sel.classList].filter(c=>c!=="input"&&!c.includes(":")&&!/^(flex|w-full|min-w-0|rounded-md|border|border-input|bg-transparent|text-foreground|shadow-xs|transition|duration|ease|outline-none|focus-ring|px-3|py-1|h-9|text-base|read-only|disabled|placeholder|selection|dark|aria|file)/.test(c)).join(" ")+" ds-sel "+SEL_TRIG;
  t.setAttribute("aria-haspopup","listbox");t.setAttribute("aria-expanded","false");
  const lab=sel.id&&document.querySelector(`label[for="${sel.id}"]`);
  t.setAttribute("aria-label",sel.getAttribute("aria-label")||(lab?lab.textContent.trim():"Pilih"));
  if(sel.getAttribute("style"))t.setAttribute("style",sel.getAttribute("style"));
  if(sel.disabled)t.disabled=true;
  const sync=()=>{const o=sel.options[sel.selectedIndex];t.innerHTML=`<span class="ds-sel-v ellip">${esc(o?o.text:"Pilih…")}</span>${svg("chev",14)}`;};
  sync();sel.classList.add("ds-native");sel.tabIndex=-1;sel.setAttribute("aria-hidden","true");
  sel.after(t);sel._dsTrig=t;t._sel=sel;sel._sync=sync;
  sel.addEventListener("change",sync);
  sel.addEventListener("focus",()=>t.focus());
  t.addEventListener("click",e=>{e.stopPropagation();LB&&LB.sel===sel?closeLB():openLB(sel);});
  t.addEventListener("keydown",e=>{if(["ArrowDown","ArrowUp","Enter"," "].includes(e.key)){e.preventDefault();openLB(sel);}});
 });
}
function openLB(sel){
 closeLB();const t=sel._dsTrig;const r=t.getBoundingClientRect();
 const el=document.createElement("div");el.className="ds-lb "+DS.menu;el.setAttribute("role","listbox");el.tabIndex=-1;
 el.setAttribute("aria-label",t.getAttribute("aria-label"));
 let html="",i=0;
 const opt=o=>{const on=o.selected;const idx=[...sel.options].indexOf(o);return `<div role="option" class="ds-opt ${DS.mi}" data-i="${idx}" aria-selected="${on}" ${o.disabled?'aria-disabled="true"':""} tabindex="-1"><span class="grow ellip">${esc(o.text)}</span>${on?svg("check",14):""}</div>`;};
 [...sel.children].forEach(c=>{if(c.tagName==="OPTGROUP"){html+=`<div class="ds-og">${esc(c.label)}</div>`+[...c.children].map(opt).join("");}else html+=opt(c);});
 el.innerHTML=html;document.body.appendChild(el);
 const w=Math.max(r.width,180);const below=innerHeight-r.bottom-8;const h=Math.min(el.scrollHeight,300);
 el.style.cssText=`position:fixed;z-index:95;left:${Math.min(r.left,innerWidth-w-8)}px;width:${w}px;max-height:300px;${below<h&&r.top>below?`bottom:${innerHeight-r.top+4}px`:`top:${r.bottom+4}px`}`;
 LB={el,sel};t.setAttribute("aria-expanded","true");
 const cur=el.querySelector('[aria-selected="true"]')||el.querySelector(".ds-opt");if(cur){cur.focus();cur.scrollIntoView({block:"nearest"});}
 el.addEventListener("click",e=>{const o=e.target.closest(".ds-opt");if(!o||o.getAttribute("aria-disabled"))return;pick(+o.dataset.i);});

  if(e.key==="ArrowDown"){e.preventDefault();opts[Math.min(k+1,opts.length-1)].focus();}
  else if(e.key==="ArrowUp"){e.preventDefault();opts[Math.max(k-1,0)].focus();}
  else if(e.key==="Home"){e.preventDefault();opts[0].focus();}else if(e.key==="End"){e.preventDefault();opts[opts.length-1].focus();}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();if(k>=0)pick(+opts[k].dataset.i);}
  else if(e.key==="Escape"||e.key==="Tab"){e.preventDefault();e.stopPropagation();const tt=LB.sel._dsTrig;closeLB();tt.focus();}

}

/* ---------- 2. Tugas saya: sederhana, dikelompokkan menurut tenggat ---------- */
pTugas=function(){
 const me="sari";const mine=allItems().filter(i=>i.assignee===me);
 const open=mine.filter(i=>STAT[i.status].cat!=="done");const n=iso(S.now);const wk=new Date(S.now);wk.setDate(wk.getDate()+7);
 const due=i=>i.isR?i.due:i.due;
 const b={late:[],today:[],week:[],later:[],none:[]};
 open.forEach(i=>{const d=due(i);if(!d)b.none.push(i);else if(iso(d)===n)b.today.push(i);else if(d<S.now)b.late.push(i);else if(d<=wk)b.week.push(i);else b.later.push(i);});
 Object.values(b).forEach(l=>l.sort((x,y)=>(x.due||0)-(y.due||0)));
 const groups=[{key:"t-late",label:"Terlambat",color:"var(--error-solid)",items:b.late},{key:"t-today",label:"Hari ini",color:"var(--brand-default)",items:b.today},{key:"t-week",label:"7 hari ke depan",color:"var(--task-in-progress-solid)",items:b.week},{key:"t-later",label:"Nanti",color:"var(--fg-subtle)",items:b.later},{key:"t-none",label:"Tanpa tenggat",color:"var(--fg-disabled)",items:b.none},{key:"t-done",label:"Selesai",color:"var(--task-complete-solid)",items:mine.filter(i=>STAT[i.status].cat==="done"),closed:true}].filter(g=>g.items.length);
 const proj=i=>`<button class="cu-link" data-proj="${(projByName(i.proj)||{}).id}">${esc(i.proj)}</button>`;
 return `<div class="page">${pageHead("Tugas saya",`${open.length} tugas terbuka${b.late.length?` · <span class="t-late">${b.late.length} terlambat</span>`:""}`,`<button class="btn btn-primary btn-sm" data-act="newtask">${svg("plus",14)}Tugas baru</button>`)}
 ${stateWrap(empty=>empty||!mine.length?emptyBox("check","Tidak ada tugas untuk Anda","Tugas yang ditugaskan kepada Anda dari semua proyek muncul di sini.",""):cuList(groups,[["Proyek",proj,"170px"],["Tenggat / SLA",cuDue,"170px"],["Prioritas",cuPrio,"120px"]],{add:false}))}</div>`;
};

  <span class="in-acts">${n.unread?`<button class="btn btn-ghost btn-sm icon-btn" data-in="read" data-id="${n.id}" aria-label="Tandai dibaca" title="Tandai dibaca">${svg("check",15)}</button>`:""}<button class="btn btn-ghost btn-sm icon-btn" data-in="arch" data-id="${n.id}" aria-label="Arsipkan" title="Arsipkan">${svg("archive",15)}</button></span></div>`;
 const tabs=[["all","Semua",live.length],["unread","Belum dibaca",unread.length],["me","Untuk saya",live.filter(n=>["asg","men"].includes(nKind(n))).length]];
 return `<div class="page page-read">${pageHead("Kotak masuk",unread.length?`${unread.length} belum dibaca`:"Semua sudah dibaca",unread.length?`<button class="btn btn-ghost btn-sm" data-in="readall">${svg("check",14)}Tandai semua dibaca</button>`:"")}
 <div class="tabs" role="tablist">${tabs.map(([k,l,n])=>`<button class="tab" role="tab" data-in="f" data-k="${k}" aria-selected="${f===k}">${l}<span class="cnt num">${n}</span></button>`).join("")}</div>

}

  return `<article class="card pl-card"><button class="pl-sp" data-space="${s.id}" title="Buka space ${esc(s.name)}"><span class="pl-spic" aria-hidden="true">${spIcon(s,12)}</span><span class="ellip">${esc(s.name)}</span></button>
